.ab.chg{border-color:#c08a3a}.ab.chg.prim{box-shadow:0 0 10px #ffd060;border-color:#ffd060}.ab.chg.auto{animation:chgA 0.9s linear infinite;border-color:#ffd060}@keyframes chgA{0%{box-shadow:0 0 0 2px #ffd060,0 0 8px #ff8a20}50%{box-shadow:0 0 0 2px #ff8a20,0 0 14px #ffd060}100%{box-shadow:0 0 0 2px #ffd060,0 0 8px #ff8a20}}.ab.job{border-color:#ffe066}.barsep{width:8px}
.shop,#bag,#cpanel,#qpanel{background:rgba(14,10,30,.96)!important}#qpanel{position:absolute;right:10px;top:56px;width:min(300px,92vw);padding:10px;display:none;z-index:40;font-size:12px}.qb{display:block;width:100%;text-align:left;margin:4px 0;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font:inherit;cursor:pointer}.qb small{display:block;opacity:.7;font-size:11px}.qb.on{border-color:var(--gold);background:rgba(245,197,66,.25)}.shop{max-width:560px;width:94vw;margin-top:6vh;padding:16px;max-height:84vh;overflow:auto;font-size:14px}.shop h2{margin:0 0 8px;color:var(--gold);font-family:Cinzel}

#title{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(80,30,140,.55),rgba(8,4,20,.92) 70%),linear-gradient(#05030c,#120624);user-select:none}
#title.out{animation:tout .65s ease forwards}@keyframes tout{to{opacity:0;transform:scale(1.15);filter:blur(6px)}}
#embers{position:absolute;inset:0;pointer-events:none}
#title .sigil{position:absolute;width:min(78vw,620px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,200,110,.35);box-shadow:0 0 60px rgba(255,170,60,.25),inset 0 0 80px rgba(140,90,255,.25);animation:spin 40s linear infinite}

#title .l2{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(14px,3vw,30px);color:#cdb8ff;letter-spacing:.35em;text-shadow:0 0 18px rgba(150,110,255,.9);margin-top:4px}

function chReady(k){ return (primed[k]||(me.cha&&me.cha[k]))&&chCount(k)>0; }
function chUse(k){ const g=wGrade(); me.ch[k][g]--; primed[k]=false; chargeFlash(k); }
function chargeFlash(k){ const col=k==='ss'?0xffb040:k==='sps'?0x50c8ff:0x8affff; const p=new THREE.Vector3(); hero.arms[0].hand.getWorldPosition(p); burst(p.x,p.y,p.z,col,14,5,0.45); ringWave(me.x,me.z,1.6,col); if(AC){ const t=AC.currentTime; const o=AC.createOscillator(), gg=AC.createGain(); o.type='triangle'; o.frequency.setValueAtTime(k==='ss'?500:800,t); o.frequency.exponentialRampToValueAtTime(k==='ss'?1400:2200,t+0.12); gg.gain.setValueAtTime(0.08,t); gg.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.connect(gg); gg.connect(master); o.start(t); o.stop(t+0.2); } }
// multiplicador al pegar: tipo 'fis' | 'mag' | 'heal'
function chargeMul(kind){ if(kind==='fis'){ if(chReady('ss')){ chUse('ss'); return 2; } return 1; }
  if(chReady('bss')){ chUse('bss'); return 2.5; } if(kind==='mag'&&chReady('sps')){ chUse('sps'); return 1.5; } return 1; }
function chargeCastMul(){ if(chReady('bss')) return 0.6; if(chReady('sps')) return 0.85; return 1; }
function chargeBarHTML(){ return Object.keys(CHG).map(k=>`<div class="ab chg ${me.cha&&me.cha[k]?'auto':''} ${primed[k]?'prim':''}" data-c="${k}" title="${CHG[k].n} (${GRADE_N[wGrade()]}) — toca: preparar · mantén o clic derecho: automático. ${CHG[k].d}">${CHG[k].i}<small class="chn">${chCount(k)}</small></div>`).join(''); }
function bindChargeBar(){ $('bar').querySelectorAll('.chg').forEach(el=>{ let lt=null, long=false; const k=el.dataset.c;
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); long=false; lt=setTimeout(()=>{ long=true; toggleAutoCh(k); },500); });
  el.addEventListener('pointerup',e=>{ e.stopPropagation(); clearTimeout(lt); if(!long&&e.button!==2){ if(chCount(k)<=0){ toast('Sin '+CHG[k].n.toLowerCase()+' de grado '+GRADE_N[wGrade()],'Cómpralas al Comerciante Ramón'); return; } primed[k]=!primed[k]; SFX.coin(); refreshChargeBar(); } });
  el.addEventListener('contextmenu',e=>{ e.preventDefault(); clearTimeout(lt); toggleAutoCh(k); }); }); }
function toggleAutoCh(k){ me.cha=me.cha||{}; me.cha[k]=!me.cha[k]; toast(CHG[k].n+(me.cha[k]?': automático ACTIVADO':': automático desactivado')); refreshChargeBar(); }
function refreshChargeBar(){ $('bar').querySelectorAll('.chg').forEach(el=>{ const k=el.dataset.c; el.classList.toggle('auto',!!(me.cha&&me.cha[k])); el.classList.toggle('prim',!!primed[k]); const n=el.querySelector('.chn'); if(n) n.textContent=chCount(k); }); }
/* ---- encantamiento de armas ---- */
function enchRate(en){ return en<3?1:Math.max(0.25,0.7-(en-3)*0.04); }
function enchant(blessed){ const it=me.eq.arma; if(!it){ toast('Equípate un arma primero'); return; } const key=blessed?'ben':'en'; if(!(me.scr&&me.scr[key]>0)){ toast('No tienes ese pergamino','Cómpralo al Comerciante Ramón'); return; }
  me.scr[key]--; const en=it.en|0; const ok=Math.random()<enchRate(en); const p=new THREE.Vector3(); hero.arms[0].hand.getWorldPosition(p);
  if(ok){ it.en=en+1; burst(p.x,p.y,p.z,0xfff2a0,30,7,0.5); ringWave(me.x,me.z,3,0xffe066); SFX.lvl(); toast('¡Encantamiento exitoso!',itemName(it)); }
  else if(blessed){ it.en=0; burst(p.x,p.y,p.z,0x8a8aff,20,5,0.4); SFX.hurt(); toast('El encantamiento falló','El pergamino bendito protegió tu arma, pero volvió a +0'); }
  else { delete me.eq.arma; const cr=2+Math.floor(it.l/3)+en; me.mats.cristal=(me.mats.cristal||0)+cr; burst(p.x,p.y,p.z,0x80e0ff,40,9,0.5); shake(0.4); SFX.die(); toast('💥 ¡El arma se rompió!',`Se convirtió en ${cr} Fragmentos de Cristal`); }
  recalc(); doSave(); bagDirty(); }

function glowTier(en){ return en>=15?4:en>=11?3:en>=7?2:en>=4?1:0; }
const GLOWC=[0,0xf0f4ff,0x7ad8ff,0x3a7aff,0xff2a2a];
const GLOWERS=new Set();
function applyWeaponGlow(R,en){ const tier=glowTier(en|0); if(R.wgT===tier) return; R.wgT=tier; if(R.wg){ R.wg.forEach(o=>o.parent&&o.parent.remove(o)); } R.wg=[]; GLOWERS.delete(R); if(!tier) return;
  const host=R.weapon||R.arms[0].hand; const col=GLOWC[tier]; const pts=R.weapon&&R.weapon.parent===R.arms[0].hand?[-0.3,-0.7,-1.1]:[0,0.3,0.6];
  for(const y of pts){ const s=new THREE.Sprite(sparkMat(col)); s.scale.setScalar(0.35+tier*0.12); s.position.y=y; s.material.opacity=0.45+tier*0.12; host.add(s); R.wg.push(s); }
  R.wgCol=col; R.wgTier=tier; GLOWERS.add(R); }
function updGlowers(dt){ const p=new THREE.Vector3(); for(const R of GLOWERS){ if(!R.g.parent){ GLOWERS.delete(R); continue; } const t=performance.now()/1000;
    R.wg.forEach((s,i)=>{ s.material.opacity=(0.4+R.wgTier*0.12)*(0.75+Math.sin(t*6+i)*0.25); });
    if(R.wgTier>=3&&Math.random()<dt*(R.wgTier>=4?28:14)){ (R.weapon||R.arms[0].hand).getWorldPosition(p); const s=new THREE.Sprite(sparkMat(R.wgCol)); s.position.set(p.x+(Math.random()-0.5)*0.5,p.y+(Math.random()-0.5)*0.8,p.z+(Math.random()-0.5)*0.5); s.scale.setScalar(0.18+Math.random()*0.15); scene.add(s);
      SPARKS.push({s,vx:(Math.random()-0.5)*0.6,vy:R.wgTier>=4?3+Math.random()*2:0.5,vz:(Math.random()-0.5)*0.6,t:0,life:R.wgTier>=4?0.9:0.5,ng:1}); } } }

let embersRAF=0; function startEmbers(){ const c=$('embers'); if(!c) return; const x=c.getContext('2d'); const P=[]; cancelAnimationFrame(embersRAF);
  const loop=()=>{ if(!$('embers')||$('title').style.display==='none') return; c.width=innerWidth; c.height=innerHeight; x.clearRect(0,0,c.width,c.height); if(P.length<140) P.push({x:Math.random()*c.width,y:c.height+10,v:0.4+Math.random()*1.4,s:1+Math.random()*2.5,w:Math.random()*6.28,h:Math.random()<0.7?40:270});
    for(const p of P){ p.y-=p.v; p.w+=0.03; p.x+=Math.sin(p.w)*0.6; const a=Math.max(0,p.y/c.height); x.fillStyle=`hsla(${p.h},100%,65%,${a})`; x.shadowColor=x.fillStyle; x.shadowBlur=8; x.beginPath(); x.arc(p.x,p.y,p.s,0,7); x.fill(); }
    for(let i=P.length-1;i>=0;i--) if(P[i].y<-10) P.splice(i,1); embersRAF=requestAnimationFrame(loop); }; loop(); }
async function afterTitle(){ const A=API(); if(A&&A.restore()){ await loadSlots(); if(MENU.slots!==null) return showSelect(); } if(A) showLogin(); else { MENU.guest=true; await loadSlots(); showSelect(); } }

   <button class="link" id="lguest">Jugar como invitado (se guarda solo en este dispositivo)</button><a class="link" href="/juegos/" style="text-align:center">🎮 Sala de juegos: más juegos del Multiverso</a></div>`;

  const go=async()=>{ if(MENU.busy) return; MENU.busy=true; $('lgo').textContent='…'; try{ const u=$('lu').value.trim(), p=$('lp').value; if(reg) await API().register(u,p); else await API().login(u,p); uiSnd('sel'); MENU.guest=false; await loadSlots(); showSelect(); }
    catch(e){ const k=Object.keys(ERR).find(k=>String(e.message).includes(k)); $('menu').querySelector('.err').textContent=k?ERR[k]:'No se pudo conectar. Revisa tu internet.'; $('lgo').textContent=reg?'Crear cuenta':'Entrar'; SFX.hurt(); } MENU.busy=false; };
  $('lgo').onclick=go; $('lp').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('lguest').onclick=async()=>{ MENU.guest=true; await loadSlots(); showSelect(); }; }
/* ---- ranuras ---- */
const localSlotsKey=()=>'mvo_slots_'+(MENU.guest?'invitado':(API()&&API().user||'x'));
async function loadSlots(){ let sl=[null,null,null];
  if(!MENU.guest&&API()&&API().tok){ try{ const L=await API().chars(); for(const r of L) if(r&&r.slot>=0&&r.slot<3&&r.data&&r.data.name) sl[r.slot]=r.data; }catch(e){ if(String(e.message).includes('sesion_invalida')){ await API().logout(); MENU.slots=null; showLogin('Tu sesión expiró: vuelve a ingresar'); return; } } }
  else { try{ sl=JSON.parse(localStorage.getItem(localSlotsKey())||'[null,null,null]'); }catch(e){} }
  // importar el personaje antiguo de este navegador si todo está vacío
  if(sl.every(s=>!s)){ try{ const old=JSON.parse(localStorage.getItem('mvo_char')||'null'); if(old&&old.name&&CLASSES[old.cls]){ sl[0]=old; MENU.slots=sl; await saveSlot(0,old); } }catch(e){} }
  MENU.slots=sl; }
async function saveSlot(i,data){ MENU.slots[i]=data; try{ localStorage.setItem(localSlotsKey(),JSON.stringify(MENU.slots)); }catch(e){}
  if(!MENU.guest&&API()&&API().tok){ try{ if(data) await API().saveChar(i,data); else await API().delChar(i); }catch(e){ console.warn('nube',e); } } }

function confirmDelete(i){ const d=MENU.slots[i]; const m=$('menu'); const box=document.createElement('div'); box.className='glass confirm'; box.innerHTML=`<div>¿Borrar a <b>${esc(d.name)}</b> (nivel ${d.lv})? No se puede deshacer.</div><input id="cdel" placeholder="Escribe el nombre para confirmar"><div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="btn small danger" id="cy">Borrar</button><button class="btn small" id="cn">Cancelar</button></div>`; m.appendChild(box);
