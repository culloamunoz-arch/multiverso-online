#title{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(80,30,140,.55),rgba(8,4,20,.92) 70%),linear-gradient(#05030c,#120624);user-select:none}
#title.out{animation:tout .65s ease forwards}@keyframes tout{to{opacity:0;transform:scale(1.15);filter:blur(6px)}}
#embers{position:absolute;inset:0;pointer-events:none}
#title .sigil{position:absolute;width:min(78vw,620px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,200,110,.35);box-shadow:0 0 60px rgba(255,170,60,.25),inset 0 0 80px rgba(140,90,255,.25);animation:spin 40s linear infinite}

function addGround(x,z,o){ const a=Math.random()*6.28, r=rnd(0.6,2.4); o.x=x+Math.cos(a)*r; o.z=z+Math.sin(a)*r; o.t=0;

  const g=new THREE.Group(); const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:new THREE.Color(col),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); s.scale.setScalar(big?2.4:o.k==='i'?1.7:1.2); s.position.y=0.5; g.add(s);

  g.position.set(o.x,heightAt(o.x,o.z),o.z); scene.add(g); o.g=g; o.s=s; o.col=col; grounds.push(o); }
function groundLabel(o){ return o.k==='i'?itemName(o.it):o.k==='g'?o.v+' oro':o.k==='p'?'Poción de vida':MATS[o.m].n+(o.v>1?' x'+o.v:''); }
function pickup(o){
  if(o.k==='g'){ me.gold+=o.v; SFX.coin(); addFloat(me.x,me.y+2.2,me.z,'+'+o.v+' oro','#ffd040'); }
  else if(o.k==='p'){ me.pot++; logMsg('Recoges: Poción de vida','loot'); SFX.coin(); }
  else if(o.k==='m'){ me.mats[o.m]=(me.mats[o.m]||0)+o.v; logMsg(`Recoges: ${MATS[o.m].n}${o.v>1?' x'+o.v:''}`,'loot'); SFX.coin(); }
  else { if(me.inv.length>=INV_MAX){ if(!o.full){ o.full=1; toast('Bolso lleno','Vende o tira objetos'); } return false; }
    me.inv.push(o.it); logLine(`Recoges: <span style="color:${RAR[o.it.r].c}">${esc(itemName(o.it))}</span>`,'loot'); if(o.it.r>=2){ toast(`<span style="color:${RAR[o.it.r].c}">${esc(itemName(o.it))}</span>`,'¡Objeto '+RAR[o.it.r].n.toLowerCase()+'!'); SFX.quest(); } else SFX.coin(); }
  bagDirty(); return true; }
function updGround(dt){ for(const o of grounds){ o.t+=dt; o.s.position.y=0.5+Math.sin(o.t*3)*0.15; const R=o.k==='i'?2.6:4.5;
    const dd=dist2(o.x,o.z,me.x,me.z); if(o.lock){ if(dd>36) o.lock=0; } else if(!me.dead&&dd<R*R){ if(pickup(o)) o.dead=true; } if(o.t>240) o.dead=true; if(o.dead) scene.remove(o.g); }
  for(let i=grounds.length-1;i>=0;i--) if(grounds[i].dead) grounds.splice(i,1); }
function rollRar(boss,el){ const m=(1+((me.st.mf||0)+(isNight()?25:0))/100)*(boss?4:el?2.5:1); const r=Math.random(); if(r<0.012*m) return 3; if(r<0.08*m) return 2; if(r<0.38*m) return 1; return 0; }
const SLK=['arma','armadura','casco','amuleto'];
function rollLoot(sp,x,z,mult,el){ const T=MOBT[sp.type], boss=!!T.boss;
  if(Math.random()<0.65||boss||el) addGround(x,z,{k:'g',v:Math.max(1,Math.round(rnd(1,4)*sp.lv*(boss?25:el?3:1)*mult))});
  if(Math.random()<(el?0.4:0.12)) addGround(x,z,{k:'p'});
  const mat=MOBMAT[sp.type]; if(mat&&(Math.random()<0.5||boss||el)) addGround(x,z,{k:'m',m:mat,v:boss?3:el?2:(Math.random()<0.2?2:1)});

  for(let i=0;i<nIt;i++){ let r=rollRar(boss,el); if(boss&&i===0) r=Math.max(r,2); addGround(x,z,{k:'i',it:makeItem(pick(SLK),sp.lv+(boss?3:el?1:0),r)}); }

function renderBag(){ const b=$('bag'); let h=`<span class="x" data-act="close">✕</span><h4>🎒 Bolso de ${esc(me.name)}</h4><div class="tabs"><button data-bt="eq" class="${bagTab==='eq'?'on':''}">Equipo</button><button data-bt="mat" class="${bagTab==='mat'?'on':''}">Materiales</button></div>`;

  }

  b.innerHTML=h;
  const det=b.querySelector('.idet'); if(det&&bagSel) det.scrollIntoView({block:'nearest'});
  b.querySelectorAll('[data-bt]').forEach(x=>x.onclick=()=>{ bagTab=x.dataset.bt; bagSel=null; renderBag(); });
  b.querySelectorAll('[data-eq]').forEach(x=>x.onclick=()=>{ bagSel=me.eq[x.dataset.eq]?{f:'eq',k:x.dataset.eq}:null; renderBag(); });
  b.querySelectorAll('[data-inv]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.inv; bagSel=me.inv[i]?{f:'inv',k:i}:null; renderBag(); });

function bagAct(a){ if(a==='close'){ $('bag').style.display='none'; return; } if(a==='tp'){ usePortal(); return; }
  const it=bagSel?(bagSel.f==='eq'?me.eq[bagSel.k]:me.inv[bagSel.k]):null; if(!it) return;
  if(a==='ench'||a==='bench'){ enchant(a==='bench'); bagSel=me.eq.arma?{f:'eq',k:'arma'}:null; renderBag(); return; }
  if(a==='equip'){ if(gIdx(gradeOf(it.l))>gIdx(gradeAllowed(me.lv))) toast('Penalización de grado','Este equipo supera el grado de tu nivel'); const old=me.eq[it.s]; me.eq[it.s]=it; me.inv.splice(bagSel.k,1); if(old) me.inv.push(old); bagSel={f:'eq',k:it.s}; SFX.swing(); }
  if(a==='unequip'){ if(me.inv.length>=INV_MAX){ toast('Bolso lleno'); return; } me.inv.push(it); delete me.eq[bagSel.k]; bagSel=null; }
  if(a==='sell'){ if(!nearMerchant()) return; me.gold+=price(it); SFX.coin(); if(bagSel.f==='eq') delete me.eq[bagSel.k]; else me.inv.splice(bagSel.k,1); bagSel=null; }
  if(a==='drop'){ if(bagSel.f==='eq') delete me.eq[bagSel.k]; else me.inv.splice(bagSel.k,1); addGround(me.x,me.z,{k:'i',it,lock:1}); bagSel=null; }
  recalc(); renderBag(); renderChar(); doSave(); }

const TB={muro:{n:'Muro de Escudos',i:'🛡️'},furia:{n:'Furia',i:'😤'},sigilo:{n:'Sigilo',i:'🌑'},agil:{n:'Paso Ágil',i:'💨'},oso:{n:'Forma de Oso',i:'🐻'},profecia:{n:'Fervor',i:'📿'}};
const hasTB=k=>me&&me.tb&&me.tb[k]>Date.now();
function applyJobStats(st){ const P=jobPassives();
  if(P.hp) st.mhp=Math.round(st.mhp*(1+P.hp)); if(P.mp) st.mmp=Math.round(st.mmp*(1+P.mp)); if(P.dmg) st.dmg*=1+P.dmg; if(P.armor) st.armor=Math.round(st.armor*(1+P.armor)+P.armor*40);
  if(P.aspd) st.aspd+=P.aspd; if(P.spd) st.spd*=1+P.spd; if(P.crit) st.crit=Math.min(0.65,st.crit+P.crit); if(P.critM) st.critM=(st.critM||1.8)+P.critM; if(P.ls) st.ls=Math.min(0.3,st.ls+P.ls);
  if(P.heal) st.heal*=1+P.heal; if(P.cd) st.cdM=(st.cdM||1)*(1-P.cd); if(P.mf) st.mf=(st.mf||0)+P.mf;
  if(hasTB('muro')) st.dmgTaken=(st.dmgTaken||1)*0.6; if(hasTB('furia')){ st.dmg*=1.3; st.aspd+=0.2; } if(hasTB('agil')){ st.spd*=1.35; st.aspd+=0.2; }
  if(hasTB('oso')){ st.mhp=Math.round(st.mhp*1.4); st.armor+=40; st.dmg*=1.1; } if(hasTB('profecia')){ st.dmg*=1.15; st.aspd+=0.15; }
  return st; }
function stealthHit(){ if(hasTB('sigilo')){ me.tb.sigilo=0; toast('¡Golpe desde las sombras!'); recalc(); return 3; } return 1; }
const marks={}; const markMul=id=>marks[id]>Date.now()?1.25:1;
const DOTS=[];
function jobSpecial(A){ if(A.buff){ me.tb=me.tb||{}; me.tb[A.buff.k]=Date.now()+A.buff.dur*1000; const hpF=me.hp/me.st.mhp; recalc(); me.hp=Math.round(me.st.mhp*hpF); toast(TB[A.buff.k].i+' '+TB[A.buff.k].n,A.buff.dur+' s'); spawnFx('shield',me.x,me.y,me.z); burst(me.x,me.y+1.2,me.z,0xffe066,16,5,0.4); }
  if(A.pet) summonPet(A.pet); if(A.totem) placeTotem(); }
function jobAfterHit(A,ids,dmg){ if(A.drain&&ids.length) healSelf(Math.round(dmg*A.drain*Math.min(2,ids.length)));
  if(A.mark) for(const id of ids){ marks[id]=Date.now()+10000; }
  if(A.dot) for(const id of ids.slice(0,8)) DOTS.push({id,left:A.dot.n,t:1,v:Math.max(1,Math.round(dmg*A.dot.m/Math.max(1,A.dm)))}); }
function updJobs(dt){ for(const d of DOTS){ d.t-=dt; if(d.t<=0){ d.t=1; d.left--; const ms=mobState.get(d.id); if(!ms||ms.dead){ d.left=0; continue; } myAct({k:'d',m:[d.id],v:d.v,ab:-2,th:0.5}); addFloat(ms.x,heightAt(ms.x,ms.z)+2,ms.z,String(d.v),'#a0ff60'); } }
  for(let i=DOTS.length-1;i>=0;i--) if(DOTS[i].left<=0) DOTS.splice(i,1);
  updPet(dt); updTotem(dt); if(hero){ const st=hasTB('sigilo'), bear=hasTB('oso'); { const bs=hero.baseScale; const m=bear?1.3:1; if(bs) hero.g.scale.set(bs.x*m,bs.y*m,bs.z*m); else hero.g.scale.setScalar(m); } if(hero.sneak===undefined){ hero.sneak=new THREE.Sprite(sparkMat(0x6a3aff)); hero.sneak.scale.set(2.2,3,1); hero.sneak.position.y=1.3; hero.g.add(hero.sneak); } hero.sneak.visible=st; hero.sneak.material.opacity=0.35+Math.sin(performance.now()/200)*0.1; } }

let PET=null;
function buildPetModel(t){ if(t==='lobo'){ const R=buildMob('lobo'); R.g.scale.setScalar(0.8); return R; }
  const g=new THREE.Group(), body=new THREE.Group(); g.add(body); const bone=0xe8e4d8; const R={g,body};
  const sk=sph(0.3,bone,0,12); sk.position.y=1.9; body.add(sk); for(const s of [-1,1]){ const e=sph(0.07,0xff3a3a,0xff0000,6); e.position.set(s*0.11,1.92,0.25); body.add(e); }
  for(let k=0;k<4;k++){ const r=new THREE.Mesh(new THREE.TorusGeometry(0.22-k*0.02,0.03,5,12),TM(bone)); r.position.y=1.5-k*0.13; r.rotation.x=Math.PI/2; body.add(r); } const sp=cyl(0.04,0.04,0.8,bone,6); sp.position.y=1.3; body.add(sp);
  R.arms=[]; for(const s of [-1,1]){ const a=cyl(0.04,0.04,0.7,bone,6); a.position.set(s*0.32,1.35,0); body.add(a); R.arms.push(a); } const sw=box(0.06,0.9,0.03,0x8a8a9a); sw.position.set(0.36,1.0,0.25); sw.rotation.x=0.6; body.add(sw);
  R.legs=[]; for(const s of [-1,1]){ const l=cyl(0.045,0.04,0.95,bone,6); l.position.set(s*0.14,0.48,0); body.add(l); R.legs.push(l); }
  const gl=new THREE.Sprite(sparkMat(0x8a3aff)); gl.scale.setScalar(1.6); gl.position.y=1.5; gl.material.opacity=0.4; body.add(gl);
  R.t=0; R.atkT=0; R.animate=(dt,mv)=>{ R.t+=dt; R.legs.forEach((l,i)=>l.rotation.x=mv?Math.sin(R.t*10+i*Math.PI)*0.5:0); R.arms.forEach((a,i)=>a.rotation.x=R.atkT>0?-1.4:(mv?Math.sin(R.t*6+i*Math.PI)*0.4:0)); if(R.atkT>0) R.atkT-=dt; body.position.y=Math.sin(R.t*3)*0.03; };
  return R; }
function summonPet(t){ if(PET){ scene.remove(PET.R.g); } const R=buildPetModel(t); scene.add(R.g); PET={t,R,x:me.x+1.5,z:me.z-1.5,ry:0,atk:0,life:120}; burst(PET.x,me.y+1,PET.z,t==='lobo'?0x9ad8ff:0x8a3aff,24,6,0.5); toast(t==='lobo'?'🐺 ¡Tu lobo acude!':'💀 ¡Un esqueleto se alza!','Atacará a tu objetivo'); }
function updPet(dt){ if(!PET) return; PET.life-=dt; if(PET.life<=0||me.dead){ scene.remove(PET.R.g); PET=null; return; }
  let tx=me.x-Math.sin(me.ry)*2+1, tz=me.z-Math.cos(me.ry)*2, reach=0; const tp=(target&&target.kind==='mob')?targetPos():null;
  if(tp&&dist2(tp.x,tp.z,me.x,me.z)<30*30){ tx=tp.x; tz=tp.z; reach=2.2; }
  const d=Math.sqrt(dist2(tx,tz,PET.x,PET.z)); let mv=false; if(d>reach+0.3){ const sp=Math.min(d,(PET.t==='lobo'?11:8)*dt); PET.x+=(tx-PET.x)/d*sp; PET.z+=(tz-PET.z)/d*sp; PET.ry=Math.atan2(tx-PET.x,tz-PET.z); mv=true; }
  if(d>45){ PET.x=me.x+1; PET.z=me.z+1; }
  PET.atk-=dt; if(tp&&reach&&d<=reach+0.5&&PET.atk<=0){ PET.atk=1.6; PET.R.atkT=0.5; const v=Math.round(me.st.dmg*0.7*skillMul(5)); myAct({k:'d',m:[target.id],v,ab:-2,th:1}); addFloat(tp.x,tp.y+1,tp.z,String(v),'#9ad8ff'); SFX.hit(); PET.ry=Math.atan2(tp.x-PET.x,tp.z-PET.z); }
  PET.R.g.position.set(PET.x,heightAt(PET.x,PET.z),PET.z); PET.R.g.rotation.y=PET.ry; PET.R.animate(dt,mv); }

function jobCard(id,btn){ const J=JT[id], S=J.sk; const pas=Object.entries(J.pas).map(([k,v])=>({hp:'Vida',mp:'Energía',dmg:'Daño',armor:'Defensa',aspd:'Vel. ataque',spd:'Movimiento',crit:'Crítico',critM:'Daño crítico',ls:'Robo de vida',heal:'Sanación',cd:'Recarga',mf:'Hallazgo mágico'}[k]+' '+(k==='cd'?'−':'+')+(k==='mf'?v:Math.round(v*100))+'%')).join(' · ');
  return `<div class="jcard"><div><b style="color:#ffe066">${J.n}</b> <small class="role">${J.role}</small></div><small>${J.d}</small><div style="margin-top:3px">${S.i} <b>${S.n}</b></div><small style="color:#9fe0a0">${pas}</small>${btn||''}</div>`; }
function selectJob(id){ const J=JT[id], step=(me.jp||[]).length+1, Rq=JOB_REQ[step];
  if(me.lv<Rq.lv){ toast('Necesitas nivel '+Rq.lv); return; } if(!(me.gold>=Rq.g&&hasMats(Rq.m))){ toast('Te faltan materiales u oro'); return; }
  me.gold-=Rq.g; payMats(Rq.m); me.jp=(me.jp||[]).concat([id]); me.job=me.jp.length; while(me.skl.length<4+me.job) me.skl.push(1); jobChanged(); }
function resetJobs(){ const cost=1000; if(me.gold<cost){ toast('Necesitas 1000 de oro'); return; } me.gold-=cost; const refund=me.jp.length; me.jp=[]; me.job=0; me.skl=me.skl.slice(0,4); if(PET){ scene.remove(PET.R.g); PET=null; } me.mats.cristal=(me.mats.cristal||0)+(refund>=1?5:0); me.mats.bloque=(me.mats.bloque||0)+(refund>=1?3:0); if(refund>=2){ me.mats.polvo=(me.mats.polvo||0)+4; me.mats.nucleo=(me.mats.nucleo||0)+1; } jobChanged(true); }
function jobChanged(reset){ scene.remove(hero.g); hero=buildHero(me.cls,me.race,me.ci,me.skin,me.jp,me.sex); scene.add(hero.g); hero.g.position.set(me.x,me.y,me.z); recalc(); buildBar(); SFX.lvl(); spawnFx('lvl',me.x,me.y,me.z); burst(me.x,me.y+1.5,me.z,0xfff2a0,50,9,0.6); ringWave(me.x,me.z,6,0xffe066); shake(0.3);
  if(reset){ toast('Camino reiniciado','Vuelve a elegir tu evolución'); } else { const J=JT[me.jp[me.jp.length-1]]; toast('¡Ahora eres '+J.n+'!','Nueva habilidad: '+ICO.sk(J.sk)+' '+J.sk.n+' (tecla '+(5+me.jp.length)+')'); logMsg(`¡Evolucionaste a ${J.n}!`,'sys'); }
  doSave(true); }
function jobTreeHTML(on){ const jp=me.jp||[], step=jp.length; let h=`<h3 style="margin:12px 0 4px;color:var(--gold);font-size:15px">Árbol de clases · ${clsName(me.cls,me.sex)}</h3><p style="margin:2px 0 6px;font-size:13px">Clase actual: <b>${jobName(me.cls,jp)}</b></p>`;
  if(step<2){ const opts=step===0?firstJobs(me.cls):secondJobs(jp[0]); const Rq=JOB_REQ[step+1]; const ok=me.lv>=Rq.lv&&me.gold>=Rq.g&&hasMats(Rq.m);
    h+=`<p style="font-size:12px;margin:2px 0">Requisitos para evolucionar (nivel ${Rq.lv}): ${matsStr(Rq.m)} 🪙${Rq.g} ${me.lv<Rq.lv?'<span style="color:#ff8a6a">· te falta nivel</span>':''}</p><div class="jgrid">`;
    for(const id of opts){ h+=jobCard(id,`<button class="sbtn ${ok?'':'off'}" data-k="pick_${id}" style="margin-top:5px">Elegir ${JT[id].n}</button>`); on['pick_'+id]=()=>selectJob(id); } h+='</div>'; }
  else h+='<p style="font-size:13px;opacity:.8">Alcanzaste la especialización máxima. ✨</p>';
  if(step>0){ h+=`<div class="srow"><span>Reiniciar tu camino de clase (te devuelve los materiales)</span><span>🪙1000</span><button class="sbtn red" data-k="resetjob">Reiniciar</button></div>`; on.resetjob=resetJobs; }
  // mapa completo
  h+=`<details style="margin-top:8px"><summary style="cursor:pointer;color:#ffe066">Ver el árbol completo de ${clsName(me.cls,me.sex)}</summary><div class="tree">`+firstJobs(me.cls).map(f=>`<div class="tbranch ${jp[0]===f?'mine':''}"><b>${ICO.sk(JT[f].sk)} ${JT[f].n}</b> <small>${JT[f].role}</small><div>`+secondJobs(f).map(s2=>`<span class="tleaf ${jp[1]===s2?'mine':''}">${ICO.sk(JT[s2].sk)} ${JT[s2].n}<small>${JT[s2].role}</small></span>`).join('')+'</div></div>').join('')+'</div></details>';
  return h; }

function pvpFoe(peer){ const e=peersMap.get(peer); if(!e||e.isMe||!e.pres||!e.pres.inw||e.pres.dead||e.pres.v!==VER) return null; if(party.id&&e.pres.pt===party.id) return null; if(!inArena(e.pres.x,e.pres.z)||!inArena(me.x,me.z)) return null; return e; }
function foePos(e){ return {x:e.rx??e.pres.x,z:e.rz??e.pres.z}; }
function arenaAutoTarget(){ let best=null,bd=1e9; for(const e of peersMap.values()){ if(!pvpFoe(e.peer)) continue; const p=foePos(e), d=dist2(p.x,p.z,me.x,me.z); if(d<bd){ bd=d; best=e.peer; } } if(best){ target={kind:'pl',peer:best}; return true; } return false; }
function foesHit(A){ const out=[]; const tp=targetPos();
  for(const e of peersMap.values()){ if(!pvpFoe(e.peer)) continue; const p=foePos(e);
    if(A.aoe&&!A.aoeAtTarget){ if(dist2(p.x,p.z,me.x,me.z)<A.aoe*A.aoe) out.push(e.peer); }
    else if(A.aoeAtTarget){ if(tp&&dist2(p.x,p.z,tp.x,tp.z)<A.aoe*A.aoe) out.push(e.peer); }
    else if(target&&target.kind==='pl'&&target.peer===e.peer) out.push(e.peer); } return out.slice(0,8); }

  const acr=Math.random()<(me.st.crit||0.1); const dmg=Math.round(me.st.dmg*(0.8+Math.random()*0.3)*(acr?(me.st.critM||1.8):1)*chargeMul('fis')*stealthHit()); hero.atkT=0.45; facing(); sendPvp([target.peer],dmg,null,-1); if(acr) shake(0.12); sfxFor(C.range>6?'autor':'auto'); }
function pvpHit(v,by,a){ if(me.dead||spawnProt>0||!inArena(me.x,me.z)) return; const e=peersMap.get(by); if(!e||!e.pres||!inArena(e.pres.x,e.pres.z)) return; if(party.id&&e.pres.pt===party.id) return;
  let d=Math.max(1,Math.round(v*(me.st.dmgTaken||1)*(1-Math.min(0.75,me.st.armor/(me.st.armor+100)))));
  if(shield>0){ const ab=Math.min(shield,d); shield-=ab; d-=ab; addFloat(me.x,me.y+2.4,me.z,'absorbe '+ab,'#9fd0ff'); } if(d<=0) return;
  me.hp-=d; combatT=6; SFX.hurt(); burst(me.x,me.y+1.3,me.z,0xff5a5a,8,5,0.35); addFloat(me.x,me.y+2.4,me.z,'-'+d,'#ff6a6a'); if(d>me.st.mhp*0.12) shake(0.25);

const BUFF_D={muro:'Recibes 40% menos daño',furia:'+30% de daño y +20% de velocidad de ataque',agil:'+35% de velocidad de movimiento y +20% de velocidad de ataque',oso:'Forma de oso: +40% de vida, +40 de armadura y +10% de daño',profecia:'+15% de daño y +15% de velocidad de ataque',sigilo:'Te vuelves invisible: tu próximo golpe hace el triple de daño'};
function abDesc(A){ const L=[]; const pct=v=>Math.round(v*100)+'%';
  if(A.dm){ let s=`Golpea con el ${pct(A.dm)} de tu ataque`; if(A.aoe&&!A.aoeAtTarget) s+=` a todos los enemigos a tu alrededor (${A.aoe} m)`; else if(A.aoeAtTarget) s+=` en un área de ${A.aoe} m alrededor del objetivo`; else s+=' a un enemigo'; L.push(s+'.'); }
  if(A.acrit) L.push('Siempre es golpe crítico.'); if(A.fx==='charge') L.push(`Te lanzas hacia el enemigo (desde ${A.min} m).`);
  if(A.stun) L.push(`Lo aturde ${A.stun} s.`); if(A.slow) L.push(`Lo ralentiza ${A.slow} s.`); if(A.drain) L.push(`Recuperas el ${pct(A.drain)} del daño como vida.`);

  if(A.aoeHeal) L.push(`Cura el ${pct(A.aoeHeal)} de la vida a ti y a tus aliados a ${A.aoe} m.`); if(A.shield) L.push(`Escudo que absorbe el ${pct(A.shield)} de tu vida máxima por 12 s.`);

  if(A.fx==='shout'&&A.heal&&!A.dm&&!A.buff) L.unshift('Grito que te devuelve el ánimo.');

const _arrowG={}; function arrowMesh(scale){ const g=new THREE.Group(); const k=scale||1;
  if(!_arrowG.s){ _arrowG.s=new THREE.CylinderGeometry(0.012,0.012,0.7,6); _arrowG.s.rotateX(Math.PI/2); _arrowG.h=new THREE.ConeGeometry(0.035,0.1,8); _arrowG.h.rotateX(Math.PI/2); _arrowG.f=new THREE.PlaneGeometry(0.06,0.12); }
  const sh=new THREE.Mesh(_arrowG.s,TM(0x8a5a2a)); g.add(sh); const hd=new THREE.Mesh(_arrowG.h,TM(0xd8dce8,0x202838)); hd.position.z=0.4; g.add(hd);
  for(let i=0;i<2;i++){ const f=new THREE.Mesh(_arrowG.f,new THREE.MeshBasicMaterial({color:0xf0f0f0,side:THREE.DoubleSide})); f.rotation.set(Math.PI/2,i*Math.PI/2,0); f.position.z=-0.3; f.rotation.order='ZXY'; f.rotation.z=i*Math.PI/2; g.add(f); }
  g.scale.setScalar(k); return g; }

// devuelve poses de brazos/torso según clase y avance (k de 0 a 1)
function attackPose(cls,kind,k,R){ const P={a:[null,null],ty:null,tx:null,nock:false};
  const ease=x=>x*x*(3-2*x);
  if(cls==='arquero'){ // brazo izq. (1) sostiene el arco; derecho (0) tensa la cuerda
    P.a[1]={x:-1.5,z:-0.1,e:-0.05}; P.ty=0.75; P.head=-0.65;
    if(k<0.18){ P.a[0]={x:-1.45,z:0.15,e:-0.4}; }
    else if(k<0.58){ const d=ease((k-0.18)/0.4); P.a[0]={x:-1.45-0.05*d,z:0.15-0.05*d,e:-0.4-2.2*d}; P.nock=true; }
    else { P.a[0]={x:-1.0,z:0.75,e:-0.5}; if(k>0.85) P.a[1]={x:-1.1,z:-0.1,e:-0.3}; }
    if(kind==='arrows'&&k>0.58){ P.a[1]={x:-1.9,z:-0.1,e:0}; } }
  else if(cls==='maga'){ if(kind==='nova'){ const u=ease(Math.min(1,k/0.45)); P.a[0]={x:-2.7*u,z:0.9*u,e:-0.2}; P.a[1]={x:-2.7*u,z:-0.9*u,e:-0.2}; if(k>0.45){ P.a[0]={x:-1.2,z:1.4,e:0}; P.a[1]={x:-1.2,z:-1.4,e:0}; } }
    else if(k<0.42){ const u=ease(k/0.42); P.a[0]={x:-2.5*u,z:0.3,e:-0.3}; P.a[1]={x:-1.0*u,z:-0.3,e:-1.2*u}; P.tx=-0.08*u; }
    else { P.a[0]={x:-1.35,z:0.2,e:-0.1}; P.a[1]={x:-1.6,z:-0.15,e:0}; P.tx=0.18; } }
  else if(cls==='clerigo'){ if(kind==='heal'||kind==='renew'||kind==='shield'){ const u=ease(Math.min(1,k/0.4)); P.a[0]={x:-2.8*u,z:0.5,e:-0.2}; P.a[1]={x:-2.8*u,z:-0.5,e:-0.2}; }
    else if(k<0.4){ const u=ease(k/0.4); P.a[0]={x:-3.0*u,z:0.3,e:-0.4*u}; P.a[1]={x:-0.9,z:-0.3,e:-1.0}; P.ty=-0.3*u; }
    else { P.a[0]={x:-0.7,z:0.1,e:-0.1}; P.a[1]={x:-0.9,z:-0.3,e:-1.0}; P.ty=0.3; P.tx=0.15; } }
  else { // guerrero
    if(kind==='whirl'){ P.spin=k*Math.PI*2; P.a[0]={x:-1.5,z:1.3,e:0}; P.a[1]={x:-1.5,z:-1.3,e:0}; }
    else if(kind==='shout'||kind==='shield'){ const u=ease(Math.min(1,k/0.3)); P.a[0]={x:-2.9*u,z:0.6,e:-0.2}; P.a[1]={x:-0.6,z:-0.9*u,e:-1.4}; P.tx=-0.12*u; }
    else if(k<0.38){ const u=ease(k/0.38); P.a[0]={x:-2.85*u,z:0.6*u,e:-0.6*u}; P.a[1]={x:-0.9,z:-0.2,e:-1.1}; P.ty=-0.55*u; P.tx=-0.08*u; }
    else { const u=ease(Math.min(1,(k-0.38)/0.22)); P.a[0]={x:-2.85+3.35*u,z:0.6-0.95*u,e:-0.6+0.5*u}; P.a[1]={x:-0.9,z:-0.2,e:-1.1}; P.ty=-0.55+1.0*u; P.tx=0.2*u; if(kind==='charge') P.tx=0.35; } }
  return P; }

function startTutorial(force){ if(!force&&me.tut) return; TUT={i:0,walk:0,cam:0,hits:0,skill:false,pot:false,lx:me.x,lz:me.z,ly:camYaw,t:0}; $('tut').style.display='block'; renderTut(); }
function endTutorial(){ TUT=null; $('tut').style.display='none'; if(tutArrow) tutArrow.visible=false; me.tut=1; doSave(true); }
function renderTut(){ if(!TUT) return; const S=TUT_STEPS[TUT.i]; const d=typeof S.d==='function'?S.d():S.d; const prog=`${TUT.i}/${TUT_STEPS.length-1}`;
  $('tut').innerHTML=`<div class="tt">${S.t}</div><div class="td">${d}</div><div class="tb">${S.btn?`<button class="btn small" id="tnext">${S.btn}</button>`:`<span class="tw" id="tst">${S.chk&&S.chk(TUT)?'✅':'⏳'} Hazlo para continuar</span>${S.skip?'<button class="link" id="tskip1">Omitir paso</button>':''}`}<button class="link" id="tskip">Saltar tutorial</button><span class="tp">${prog}</span></div>`;
  if($('tnext')) $('tnext').onclick=()=>{ SFX.quest&&SFX.quest(); if(S.end) endTutorial(); else { TUT.i++; renderTut(); } };
  if($('tskip1')) $('tskip1').onclick=()=>{ TUT.i++; renderTut(); }; $('tskip').onclick=endTutorial; }
let tutArrow=null;
function tutTick(dt){ if(!TUT) return; TUT.t+=dt; TUT.walk+=Math.hypot(me.x-TUT.lx,me.z-TUT.lz); TUT.lx=me.x; TUT.lz=me.z; TUT.cam+=Math.abs(camYaw-TUT.ly)+0; TUT.ly=camYaw;
  const S=TUT_STEPS[TUT.i];
  if(S.chk&&S.chk(TUT)&&!TUT.done){ TUT.done=true; SFX.quest&&SFX.quest(); toast('¡Bien hecho!'); setTimeout(()=>{ if(TUT){ TUT.done=false; TUT.i++; renderTut(); } },700); }
  // flecha guía sobre el Chatarrín más cercano
  if(S.arrow){ let best=null,bd=1e9; for(const sp of SPAWNS){ if(sp.type!=='chatarrin') continue; const ms=mobState.get(sp.id); if(!ms||ms.dead) continue; const d=dist2(ms.x,ms.z,me.x,me.z); if(d<bd){ bd=d; best=ms; } }
    if(target&&target.kind==='mob'){ const ms=mobState.get(target.id); if(ms&&!ms.dead) best=ms; }
    if(!tutArrow){ tutArrow=new THREE.Group(); const c=new THREE.Mesh(new THREE.ConeGeometry(0.45,0.9,4),new THREE.MeshBasicMaterial({color:0xffd040})); c.rotation.x=Math.PI; tutArrow.add(c); const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xffd040,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); gl.scale.setScalar(2.2); tutArrow.add(gl); scene.add(tutArrow); }
