<!DOCTYPE html>
<html lang="es">
<head>

<title>Multiverso Runner</title>

<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--y:#ffe066;--c:#7fe8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Russo One',system-ui,sans-serif;color:#fff}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;pointer-events:none;text-shadow:0 3px 0 #000,0 0 6px #000}
#score{right:14px;top:10px;font-size:30px;text-align:right}
#coins{right:14px;top:46px;font-size:20px;color:var(--y);text-align:right}
#dist{left:14px;top:12px;font-size:16px;color:#ddd}
#world{left:14px;top:34px;font-size:13px;color:var(--c)}
#pw{left:14px;top:58px;font-size:15px;line-height:1.5}
#msg{left:0;right:0;top:30%;text-align:center;font-size:48px;color:var(--y)}
#sub{left:0;right:0;top:calc(30% + 58px);text-align:center;font-size:18px}

#menu h1{margin:4px 0 0;font-size:clamp(28px,6vw,62px);color:var(--y);text-shadow:0 4px 0 #b34a00,0 8px 0 #000;text-align:center}
#menu h2{margin:4px 0 10px;font-size:clamp(13px,2.3vw,20px);color:var(--c);text-align:center}
.row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:1100px}
.btn{cursor:pointer;border:3px solid #fff;background:linear-gradient(#ff7a3c,#d83a1a);color:#fff;font:inherit;font-size:20px;padding:12px 24px;border-radius:14px;box-shadow:0 5px 0 #000;text-shadow:0 2px 0 #000}
.btn.alt{background:linear-gradient(#4aa8ff,#2a5ad8)}

.card img{width:100%;height:70px;object-fit:contain;filter:drop-shadow(0 3px 0 #000)}
.card.sel{border-color:var(--y);background:rgba(255,224,102,.22);transform:scale(1.05)}
.card .t{font-size:9px;color:var(--c)}
.help{font-size:13px;opacity:.9;max-width:720px;text-align:center;line-height:1.55;margin-top:10px}
#topbtns{position:fixed;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
#topbtns button{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;color:#fff;font-size:16px;cursor:pointer}
@media (max-height:520px){ .card{width:84px;font-size:10px} .card img{height:48px} #menu h1{font-size:28px} #menu h2{font-size:12px;margin:2px 0 6px} .btn{font-size:16px;padding:8px 16px} }
</style>
</head>

      if(ramped) for(let i=0;i<7;i++) addCoin(lanes[0],z-3-i*1.8,3.3); }
  else { makeObstacle('block',lanes[0],z); makeObstacle('low',lanes[1],z-8); makeObstacle('high',lanes[2],z-4); }

}
function makePortal(z){ const g=new THREE.Group(); for(let i=0;i<5;i++){ const t=new THREE.Mesh(new THREE.TorusGeometry(5.4-i*0.35,0.18,8,48),new THREE.MeshBasicMaterial({color:i%2?0xb45cff:0x3cf0ff})); g.add(t);} const disc=new THREE.Mesh(new THREE.CircleGeometry(4.2,32),new THREE.MeshBasicMaterial({color:0x140020,transparent:true,opacity:0.6})); g.add(disc); g.position.set(0,3.6,z); scene.add(g); return {g,z}; }
/* ---------------- PLAYER & STATE ---------------- */
let state='menu', paused=false, player=null, avatar=null, selChar=CHARS[0], speed=14, dist=0, score=0, coinN=0, t=0, mult=1, portalPending=false, nextPortal=700;
let best=0, bank=0; try{ best=+localStorage.getItem('mr_best')||0; bank=+localStorage.getItem('mr_bank')||0; }catch(e){}
const PW={magnet:0,turbo:0,shield:false,x2:0};
function newRun(){
  for(const o of obs) scene.remove(o.g); for(const c of coins) scene.remove(c.m); for(const p of pows) scene.remove(p.g); if(portal) scene.remove(portal.g); obs=[];coins=[];pows=[];portal=null;
  if(avatar) scene.remove(avatar.g);
  avatar=makeAvatar(selChar); scene.add(avatar.g);
  player={lane:1,x:0,y:0,vy:0,z:0,ground:true,slide:0,dead:false,deadT:0,lean:0,onTop:false,fly:false};
  speed=14; dist=0; score=0; coinN=0; mult=1; PW.magnet=0; PW.turbo=0; PW.shield=false; PW.x2=0; nextPortal=700; portalPending=false; rowN=0;
  setTheme(0); nextRowZ=-40; for(let i=0;i<10;i++) spawnRow(); decorZ=10; for(let z=10;z>-260;z-=12) spawnDecor(z); decorZ=-260;
  state='run'; $('menu').style.display='none'; showMsg('¡CORRE!',isTouch?'Desliza ← → cambiar carril · ↑ saltar · ↓ deslizar':'← → carril · ↑/Espacio saltar · ↓ deslizar',2.2); SFX.start(); camInit=false;
}
/* ---------------- INPUT ---------------- */
let touchStart=null;
function act(a){ if(state!=='run'||paused||player.dead) return; const p=player;
  if(a==='left'&&p.lane>0){ p.lane--; p.lean=1; SFX.lane(); } if(a==='right'&&p.lane<2){ p.lane++; p.lean=-1; SFX.lane(); }
  if(a==='up'&&(p.ground||p.slide>0)&&!p.fly){ p.vy=10.5; p.ground=false; p.slide=0; SFX.jump(); }
  if(a==='down'&&!p.fly){ if(!p.ground) p.vy=-18; p.slide=0.75; SFX.slide(); } }
addEventListener('keydown',e=>{ const m={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'down',KeyS:'down'}[e.code]; if(e.code==='KeyP'||e.code==='Escape') togglePause(); if(m){ e.preventDefault(); if(!e.repeat) act(m); } });
canvas.addEventListener('pointerdown',e=>{ touchStart={x:e.clientX,y:e.clientY,t:performance.now(),done:false}; });
canvas.addEventListener('pointermove',e=>{ if(!touchStart||touchStart.done) return; const dx=e.clientX-touchStart.x, dy=e.clientY-touchStart.y; const th=Math.min(innerWidth,innerHeight)*0.06;
  if(Math.abs(dx)>th||Math.abs(dy)>th){ touchStart.done=true; if(Math.abs(dx)>Math.abs(dy)) act(dx<0?'left':'right'); else act(dy<0?'up':'down'); } });
canvas.addEventListener('pointerup',e=>{ if(touchStart&&!touchStart.done&&performance.now()-touchStart.t<250){ act('up'); } touchStart=null; });
$('muteb').onclick=()=>{ muted=!muted; $('muteb').textContent=muted?'🔇':'🔊'; if(master) master.gain.value=muted?0:0.45; };
$('pauseb').onclick=()=>togglePause();
function togglePause(){ if(state!=='run') return; paused=!paused; if(paused) menu(`<h1>PAUSA</h1><div class="row"><button class="btn" id="res">SEGUIR</button><button class="btn alt" id="quit">MENÚ</button></div>`,()=>{ $('res').onclick=()=>{ paused=false; $('menu').style.display='none'; }; $('quit').onclick=()=>{ paused=false; mainMenu(); }; }); }
/* ---------------- UPDATE ---------------- */
let msgT=0; function showMsg(a,b,d){ $('msg').textContent=a; $('sub').textContent=b||''; msgT=d; }
function laneBlocked(lane,z,y){ // returns obstacle colliding at (lane,z,y)
  for(const o of obs){ if(o.lane!==lane) continue; const z0=o.z+ (o.ramp?6.2:o.type.startsWith('train')?1.1:o.len/2), z1=o.z-(o.type.startsWith('train')?o.len-1.1:o.len/2);
    if(z>z1&&z<z0+0.4) return o; } return null; }
function topAt(o,z){ if(!o) return 0; if(o.type==='trainR'||o.type==='train'){ if(o.ramp&&z>o.z+1.1&&z<o.z+6.2){ return clamp((o.z+6.2-z)/5.1,0,1)*2.4; } if(z<=o.z+1.1&&z>o.z-o.len+1.1) return 2.4; } return 0; }
function update(dt){
  t+=dt; musicTick();
  if(msgT>0){ msgT-=dt; $('msg').style.opacity=Math.min(1,msgT*3); $('sub').style.opacity=Math.min(1,msgT*3); if(msgT<=0){ $('msg').textContent=''; $('sub').textContent=''; } }
  if(state!=='run'||paused) return;
  const p=player;
  if(p.dead){ p.deadT+=dt; p.vy-=24*dt; p.y=Math.max(0,p.y+p.vy*dt); avatar.g.rotation.x=lerp(avatar.g.rotation.x,-1.3,0.08); if(p.deadT>1.6&&state==='run') gameOver(); updateVisual(dt); return; }
  speed=Math.min(30,14+dist/220); const sp=speed*(PW.turbo>0?1.25:1);
  p.z-=sp*dt; dist+=sp*dt; score+=sp*dt*0.5*(PW.x2>0?2:1);
  // lane
  const tx=(p.lane-1)*LANE; const px=p.x; p.x=lerp(p.x,tx,1-Math.exp(-dt*14)); p.lean=lerp(p.lean,0,dt*5);
  // turbo flight
  if(PW.turbo>0){ PW.turbo-=dt; p.fly=true; p.y=lerp(p.y,6,dt*3); p.vy=0; p.ground=false; if(PW.turbo<=0){ p.fly=false; p.vy=0; } }
  else {
    const cur=laneBlocked(p.lane,p.z,p.y); const gTop=topAt(cur,p.z);
    if(!p.ground||p.y>gTop+0.05){ p.vy-=30*dt; p.y+=p.vy*dt; if(p.y<=gTop){ if(!p.ground) SFX.land(); p.y=gTop; p.vy=0; p.ground=true; } else p.ground=false; }
    else { p.y=gTop; p.ground=true; }
  }
  if(p.slide>0) p.slide-=dt;
  // collisions
  if(!p.fly){
    for(const o of obs){ if(o.hit) continue; const ox=(o.lane-1)*LANE; if(Math.abs(ox-p.x)>LANE*0.55) continue;
      const front=o.type.startsWith('train')?o.z+1.1:o.z+o.len/2, back=o.type.startsWith('train')?o.z-o.len+1.1:o.z-o.len/2;
      if(p.z>front+0.3||p.z<back-0.3) continue;
      let hit=false;
      if(o.type==='low') hit=p.y<0.95; else if(o.type==='high') hit=!(p.slide>0); else if(o.type==='block') hit=p.y<2.5;
      else { const top=topAt(o,p.z); hit=p.y<top-0.5; if(o.ramp&&p.z>o.z+1.1) hit=false; if(p.z<=o.z+1.1&&p.y>=2.0) hit=false; }
      // side hit when changing lanes into something: if x not centered, bounce back
      if(hit){ if(Math.abs(ox-p.x)>LANE*0.35&&Math.abs(tx-ox)<0.1){ p.lane=Math.round(px/LANE)+1; p.lane=clamp(p.lane,0,2); if(p.lane===o.lane) p.lane=clamp(o.lane+(px>ox?1:-1),0,2); shake=0.3; SFX.hit(); continue; }
        if(PW.shield){ PW.shield=false; o.hit=true; o.g.visible=false; SFX.shieldOff(); shake=0.4; showMsg('¡ESCUDO!','',0.8); }
        else { p.dead=true; p.vy=6; SFX.hit(); shake=0.6; showMsg('¡CHOQUE!','',1.4); } break; } }
  }
  // moving trains
  for(const o of obs) if(o.moving){ o.z+=o.moving*dt; o.g.position.z=o.z; }
  // coins
  for(const c of coins){ if(c.taken) continue; c.m.rotation.z+=dt*5;
    if(PW.magnet>0&&c.z>p.z-26&&c.z<p.z+2){ c.m.position.x=lerp(c.m.position.x,p.x,dt*8); c.m.position.y=lerp(c.m.position.y,p.y+1,dt*8); c.m.position.z=lerp(c.m.position.z,p.z,dt*8); }
    const dx=c.m.position.x-p.x, dy=c.m.position.y-(p.y+0.9), dz=c.m.position.z-p.z;
    if(dx*dx+dy*dy+dz*dz<1.3*1.3){ c.taken=true; scene.remove(c.m); coinN++; score+=10*(PW.x2>0?2:1); SFX.coin(); } }
  coins=coins.filter(c=>!c.taken&&c.m.position.z<p.z+12);
  for(const pw of pows){ pw.g.rotation.y+=dt*2; pw.g.position.y=1.1+Math.sin(t*4)*0.2; const dx=pw.g.position.x-p.x, dz=pw.z-p.z; if(!pw.got&&Math.abs(dx)<1.2&&Math.abs(dz)<1.2&&Math.abs(p.y+1-pw.g.position.y)<2){ pw.got=true; scene.remove(pw.g); givePow(pw.kind); } }
  pows=pows.filter(x=>!x.got&&x.z<p.z+12);
  if(PW.magnet>0) PW.magnet-=dt; if(PW.x2>0) PW.x2-=dt;
  // cleanup
  for(const o of obs) if(o.z-o.len>p.z+14){ scene.remove(o.g); o.dead=true; } obs=obs.filter(o=>!o.dead);
  while(nextRowZ>p.z-200) spawnRow();
  while(decorZ>p.z-260){ spawnDecor(decorZ); decorZ-=12; }
  for(const d of decor) if(d.z>p.z+20){ scene.remove(d.o); d.dead=true; } decor=decor.filter(d=>!d.dead);
  // portal
  if(dist>nextPortal&&!portal&&!portalPending){ portalPending=true; }
  if(portal){ portal.g.rotation.z+=dt*2; if(p.z<portal.z){ scene.remove(portal.g); portal=null; nextPortal=dist+900; flash=1; SFX.portal(); score+=500; setTheme(themeI+1); showMsg(THEMES[themeI].name,'+500 · ¡Nuevo universo!',2);
      for(const o of obs) if(o.z<p.z&&o.z>p.z-30){ scene.remove(o.g); o.dead=true; } obs=obs.filter(o=>!o.dead); } }
  updateVisual(dt);
}
function givePow(k){ SFX.power(); if(k==='shield') PW.shield=true; else PW[k]=POW[k].t; showMsg(POW[k].name,'',1.2); if(k==='turbo'){ for(let i=0;i<30;i++) addCoin(i%3===0?player.lane:player.lane,player.z-10-i*2.2,6.6); } }
/* ---------------- VISUALS / CAMERA ---------------- */
let shake=0, flash=0, camInit=false; const camP=new THREE.Vector3(), camL=new THREE.Vector3(); let shieldMesh=null;
function updateVisual(dt){
  const p=player; avatar.g.position.set(p.x,p.y,p.z); avatar.g.rotation.y=Math.PI; if(!p.dead) avatar.g.rotation.x=0; avatar.g.rotation.z=p.lean*0.25;
  avatar.animate({mode:'run',speed,ground:p.ground,slide:p.slide,fly:p.fly,vy:p.vy},dt,t);
  avatar.setThrust(p.fly?1:(PW.turbo>0?1:0));
  if(!shieldMesh){ shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(1.6,20,14),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.18,depthWrite:false})); scene.add(shieldMesh); }

  // env follow
  if(envGroup){ for(const c of envGroup.children){ if(c===groundMesh||c===roadMesh||c.userData.follow){ c.position.z=p.z-150; } if(c===skyMesh||c.userData.sky){ c.position.z=(c===skyMesh?p.z:p.z-420); } }
    roadTex.offset.y=(-p.z/20)%1; groundTex.offset.y=(-p.z/15)%1; }
  const tp=new THREE.Vector3(p.x*0.7,p.y*0.6+3.1+(p.fly?1.2:0),p.z+5.4);
  if(!camInit){ camP.copy(tp); camInit=true; } camP.lerp(tp,1-Math.exp(-dt*8));
  const tl=new THREE.Vector3(p.x*0.5,p.y*0.65+1.5,p.z-7); camL.lerp(tl,camInit?1-Math.exp(-dt*10):1);
  camera.position.copy(camP); if(shake>0){ shake-=dt; camera.position.x+=rnd(-1,1)*shake*0.5; camera.position.y+=rnd(-1,1)*shake*0.5; }
  camera.lookAt(camL);
  const fovT=(innerWidth<innerHeight?78:60)+clamp((speed-14)*0.5,0,8)+(p.fly?6:0); camera.fov=lerp(camera.fov,fovT,0.05); camera.updateProjectionMatrix();
  sun.position.set(p.x-6,14,p.z+8); sun.target.position.set(p.x,0,p.z); sun.target.updateMatrixWorld();
  // HUD
  $('score').textContent=Math.floor(score).toLocaleString('es-CL'); $('coins').textContent='🪙 '+coinN; $('dist').textContent=Math.floor(dist)+' m'; $('world').textContent=THEMES[themeI].name;
  const pw=[]; if(PW.shield) pw.push('🛡️ escudo'); if(PW.magnet>0) pw.push('🧲 '+Math.ceil(PW.magnet)+'s'); if(PW.turbo>0) pw.push('🚀 '+Math.ceil(PW.turbo)+'s'); if(PW.x2>0) pw.push('✖2 '+Math.ceil(PW.x2)+'s'); $('pw').innerHTML=pw.join('<br>');
  canvas.style.filter=flash>0?`brightness(${1+flash*2.5})`:'none'; if(flash>0) flash-=dt*1.6;
}
/* ---------------- MENUS ---------------- */
function menu(html,bind){ const m=$('menu'); m.innerHTML=html; m.style.display='flex'; if(bind) bind(); }
function hud(v){ for(const id of ['score','coins','dist','world','pw']) $(id).style.display=v?'block':'none'; $('pauseb').style.display=v?'block':'none'; }
function mainMenu(){
  state='menu'; hud(false); paused=false;
  menu(`<h1>MULTIVERSO RUNNER</h1><h2>Corre por los universos de nuestra serie</h2>
   <div class="row">${CHARS.map(c=>`<div class="card ${c.id===selChar.id?'sel':''}" data-c="${c.id}"><img src="${c.img}"><div>${c.name}</div><div class="t">${c.tag}</div></div>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" id="go">▶ ¡CORRER!</button></div>
   <div class="help">${isTouch?'Desliza ← → para cambiar de carril · ↑ saltar (o toca) · ↓ deslizarte bajo las barras.':'← → cambiar carril · ↑ o Espacio saltar · ↓ deslizarse · P pausa.'}<br>Sube a los trenes por sus rampas, junta monedas y power-ups: 🧲 imán · 🚀 turbo vuelo · 🛡️ escudo · ✖2 puntos dobles. Cada 900 m cruzas un portal a otro universo.<br>Récord: <b>${Math.floor(best).toLocaleString('es-CL')}</b> · Monedas totales: <b>${bank}</b></div>`,()=>{
    document.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{ selChar=CHARS.find(c=>c.id===el.dataset.c); document.querySelectorAll('.card').forEach(x=>x.classList.toggle('sel',x===el)); previewChar(); });
    $('go').onclick=()=>{ unlockAudio(); hud(true); newRun(); }; });
  previewChar();
}
function previewChar(){ if(avatar) scene.remove(avatar.g); for(const o of obs) scene.remove(o.g); obs=[]; for(const c of coins) scene.remove(c.m); coins=[];
  if(!envGroup){ setTheme(0); } avatar=makeAvatar(selChar); scene.add(avatar.g); player={lane:1,x:0,y:0,vy:0,z:0,ground:true,slide:0,dead:false,lean:0,fly:false}; }
function gameOver(){
  state='over'; hud(false); SFX.over(); bank+=coinN; const nb=score>best; if(nb) best=score; try{ localStorage.setItem('mr_best',best); localStorage.setItem('mr_bank',bank);}catch(e){}
  menu(`<h1>${nb?'¡NUEVO RÉCORD!':'¡FIN DE LA CARRERA!'}</h1><h2>${selChar.name} · ${THEMES[themeI].name}</h2>
   <div style="font-size:26px;margin:10px">Puntaje: <b style="color:var(--y)">${Math.floor(score).toLocaleString('es-CL')}</b></div>
   <div style="font-size:18px">Distancia: ${Math.floor(dist)} m · Monedas: ${coinN}</div><br>
   <div class="row"><button class="btn" id="again">▶ OTRA VEZ</button><button class="btn alt" id="home">PERSONAJES</button></div>`,()=>{ $('again').onclick=()=>{ hud(true); newRun(); }; $('home').onclick=mainMenu; });
}
/* ---------------- LOOP ---------------- */
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  if(state==='menu'&&avatar){ t+=0; const a=t*0.4; avatar.g.position.set(0,0,0); avatar.g.rotation.set(0,Math.sin(a)*0.6,0); avatar.animate({mode:'run',speed:9,ground:true,slide:0,fly:false},dt,performance.now()/1000);
    camera.position.set(Math.sin(a*0.5)*1.5,2.6,5.2); camera.lookAt(0,1.3,0); if(envGroup) for(const c of envGroup.children){ if(c===skyMesh) c.position.set(0,0,0);} t+=dt; }
  renderer.render(scene,camera); requestAnimationFrame(frame); }
resize(); hud(false); mainMenu(); requestAnimationFrame(frame);
window.__run={sim(sec){ for(let i=0;i<sec*60;i++){ PW.shield=true; update(1/60); } },get theme(){return THEMES[themeI].name},get state(){return state},get player(){return player},act,newRun,get dist(){return dist},get score(){return score},CHARS,setChar:i=>{selChar=CHARS[i];},PW,get obs(){return obs},giveShield:()=>{PW.shield=true}};
</script>
