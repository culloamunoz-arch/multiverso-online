function hueShift(hex,deg){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,bb=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,bb),mn=Math.min(r,g,bb); let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-bb)/d+(g<bb?6:0):mx===g?(bb-r)/d+2:(r-g)/d+4; h/=6;}
  h=(h+deg/360)%1; const f=(p,q,t)=>{t=(t+1)%1; return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q; const to=v=>Math.round(v*255).toString(16).padStart(2,'0');
  return '#'+to(f(p,q,h+1/3))+to(f(p,q,h))+to(f(p,q,h-1/3));
}

let L=null; // current level
function buildLevel(wi,loop){
  const rnd=mulberry(9001+wi*131+loop*7), ri=(a,c)=>a+Math.floor(rnd()*(c-a+1));
  const COLS=210, g=[]; for(let y=0;y<ROWS;y++) g.push(new Array(COLS).fill('.'));
  const contents={}, enemies=[], coins=[];
  const cloud=wi===5, diff=Math.min(3,Math.floor(wi/2)+loop);
  const set=(x,y,ch)=>{ if(x>=0&&x<COLS&&y>=0&&y<ROWS) g[y][x]=ch; };
  const ground=(x0,x1)=>{ for(let x=x0;x<x1;x++){ set(x,13,cloud?'c':'#'); set(x,14,cloud?'c':'#'); } };
  const q=(x,y,what='coin')=>{ set(x,y,'?'); contents[x+','+y]=what; };
  const brick=(x,y,what)=>{ set(x,y,'B'); if(what) contents[x+','+y]=what; };
  const pipe=(x,h)=>{ for(let y=13-h;y<13;y++){ set(x,y,y===13-h?'T':'p'); set(x+1,y,y===13-h?'U':'q'); } };
  const enemy=(x,y,t='w')=>enemies.push({x:x*TS,y:y*TS,t});
  const coinAt=(x,y)=>coins.push({x:x*TS+4,y:y*TS+2,taken:false});
  let x=0; ground(0,18); q(10,9,'power'); q(14,9); brick(13,9); brick(15,9); q(14,5); enemy(16,12);
  x=18; let starPlaced=false, powers=1, mid=0;
  const segs=['blocks','pipes','pit','stairs','float','turtle','coinpit','blocks','pipes','pit','float','stairs','turtle','pit'];
  for(let s=0;x<COLS-48;s++){
    const k=segs[(s+wi*3+loop)%segs.length];
    if(s===6) mid=x;
    if(k==='blocks'){ const L2=14; ground(x,x+L2); brick(x+3,9); q(x+4,9, (powers<2&&s>3)?'power':'coin'); if(powers<2&&s>3) powers++; brick(x+5,9,!starPlaced&&s>=4?'star':null); if(!starPlaced&&s>=4) starPlaced=true; q(x+6,9); brick(x+7,9); q(x+5,5);
      enemy(x+9,12); if(diff>0) enemy(x+11,12); x+=L2; }
    else if(k==='pipes'){ const L2=16; ground(x,x+L2); pipe(x+2,2); pipe(x+7,3+(diff>1?1:0)); pipe(x+12,ri(2,4)); enemy(x+5,12); enemy(x+10,12); if(diff>1) enemy(x+15,12); x+=L2; }
    else if(k==='pit'){ const gap=ri(2,2+Math.min(1,diff)); ground(x,x+4); for(let i=0;i<gap;i++) coinAt(x+4+i,9); ground(x+4+gap,x+12); brick(x+6+gap,9); brick(x+7+gap,9); q(x+8+gap,9); enemy(x+9+gap,12); x+=12; }
    else if(k==='stairs'){ ground(x,x+5); for(let i=0;i<4;i++) for(let j=0;j<=i;j++) set(x+1+i,12-j,'H');
      const gap=diff>1?3:2; ground(x+5+gap,x+16); for(let i=0;i<4;i++) for(let j=0;j<4-i;j++) set(x+5+gap+i,12-j,'H'); x+=16; }
    else if(k==='float'){ ground(x,x+16); for(let i=2;i<10;i++) brick(x+i,9); for(let i=5;i<9;i++) set(x+i,5,'B'); q(x+7,5,powers<3?'power':'coin'); powers++;
      for(let i=5;i<9;i++) coinAt(x+i,4); enemy(x+4,8); enemy(x+12,12,'s'); x+=16; }
    else if(k==='turtle'){ ground(x,x+14); enemy(x+6,12,'s'); enemy(x+9,12); enemy(x+11,12); q(x+4,9); q(x+5,9); for(let i=7;i<10;i++) coinAt(x+i,8); x+=14; }
    else if(k==='coinpit'){ ground(x,x+3); const gap=3; ground(x+3+gap,x+11); for(let i=0;i<5;i++) coinAt(x+2+i,8-(i===2?2:i===1||i===3?1:0)); x+=11; }
    if(cloud && rnd()<0.5){ // floating cloud bridges replace part of ground with pits
      const px=x-ri(5,9); let ok=true; for(let i=-3;i<5;i++){ const ch=g[13][px+i]; if(ch!=='c') ok=false; } for(let i=-1;i<3;i++) for(let yy=9;yy<13;yy++) if(g[yy][px+i]!=='.') ok=false;
      if(ok){ for(let i=0;i<2;i++){ set(px+i,13,'.'); set(px+i,14,'.'); } for(let i=-1;i<3;i++) set(px+i,9,'c'); }
    }
  }
  // ending: staircase, flag, castle
  ground(x,COLS); for(let i=0;i<8;i++) for(let j=0;j<=i;j++) set(x+2+i,12-j,'H'); for(let j=0;j<8;j++) set(x+10,12-j,'H');
  const flagX=x+14; set(flagX,12,'H');
  const castleX=x+20;
  return {g,COLS,contents,enemies,coins,flagX,castleX,mid,startX:2*TS};
}

function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.35; master.connect(AC.destination);}catch(e){AC=null} }
function tone(f,t0,dur,type='square',vol=0.12,slideTo=0){
  if(!AC||muted) return; const o=AC.createOscillator(),gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  gn.gain.setValueAtTime(vol,t0); gn.gain.exponentialRampToValueAtTime(0.0005,t0+dur); o.connect(gn); gn.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
let NB=null;
function noise(t0,dur,vol=0.15,hp=1000){
  if(!AC||muted) return; if(!NB){ NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=AC.createBufferSource(); s.buffer=NB; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const gn=AC.createGain();
  gn.gain.setValueAtTime(vol,t0); gn.gain.exponentialRampToValueAtTime(0.0005,t0+dur); s.connect(f); f.connect(gn); gn.connect(master); s.start(t0,Math.random()*0.5,dur+0.05);
}

function musicTick(){
  if(!AC) return; if(!song||muted){ nextT=AC.currentTime+0.05; return; }
  const st=60/song.bpm/2;
  while(nextT<AC.currentTime+0.12){
    const i=songStep%16, loopN=Math.floor(songStep/16);
    const l=song.lead[i]; if(l) tone(mt(l+(loopN%4===3?12:0)),nextT,st*0.85,'square',0.05);
    const ba=song.bass[i]; if(ba) tone(mt(ba),nextT,st*0.9,'triangle',0.12);
    if(i%4===0) noise(nextT,0.05,0.05,6000); if(i%8===4) noise(nextT,0.09,0.08,1500);
    songStep++; nextT+=st;

}

    try{ if(typeof AC!=='undefined'&&AC){ if(AC.state!=='running') AC.resume().catch(()=>{}); if(!done){ const bf=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=bf; s.connect(AC.destination); s.start(0);} } }catch(e){}
    if(!done) el.play().then(()=>{done=true}).catch(()=>{});
  }
  ['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{capture:true,passive:true}));
})();
</script>
