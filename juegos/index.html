<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiverso · Sala de Juegos</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:#f3eadb;background:#07040f;overflow-x:hidden}
#bg{position:fixed;inset:-40px;background:center/cover no-repeat;filter:blur(28px) saturate(1.3) brightness(.35);transform:scale(1.1);z-index:-2}
body:after{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% -10%,rgba(120,60,220,.45),transparent 60%),linear-gradient(transparent 60%,#07040f)}
header{text-align:center;padding:30px 16px 8px}
h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(32px,7vw,62px);margin:0;letter-spacing:.02em;background:linear-gradient(100deg,#8a5a10 0%,#ffe9a8 30%,#fff 45%,#f5c542 60%,#8a5a10 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2400) drop-shadow(0 0 22px rgba(255,180,60,.45));animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.sub{opacity:.8;margin:6px 0 0;letter-spacing:.04em}
main{max-width:1180px;margin:auto;padding:22px 16px 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:20px;overflow:hidden;background:rgba(18,11,34,.82);border:1px solid rgba(255,210,130,.22);box-shadow:0 10px 34px rgba(0,0,0,.55);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:in .6s both;animation-delay:calc(var(--i)*70ms)}
@keyframes in{from{opacity:0;transform:translateY(24px)}}
.card:hover{transform:translateY(-8px);border-color:var(--c);box-shadow:0 18px 44px rgba(0,0,0,.6),0 0 30px var(--g)}
.shot{position:relative;aspect-ratio:16/9;overflow:hidden;background:#111}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1s,transform 6s linear}
.shot img.on{opacity:1;transform:scale(1.14)}
.shot:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(10,6,22,.92));pointer-events:none}
.dots{position:absolute;right:10px;top:10px;display:flex;gap:5px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:.3s}.dots i.on{background:#fff;width:18px;border-radius:4px}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-size:11px;font-weight:800;padding:4px 9px;border-radius:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15)}
.play{position:absolute;left:50%;top:50%;z-index:2;width:62px;height:62px;margin:-31px;border-radius:50%;display:grid;place-items:center;font-size:24px;padding-left:5px;background:var(--c);color:#140b00;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:.25s}
.card:hover .play{opacity:1;transform:scale(1)}
.title{position:absolute;left:14px;bottom:10px;z-index:2;display:flex;align-items:center;gap:10px}
.title .ic{font-size:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.title b{font-family:Cinzel,serif;font-size:21px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.info{padding:12px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.info p{margin:0;font-size:14px;line-height:1.4;opacity:.88}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chips span{font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--g);border:1px solid var(--c)}
.tot{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,210,130,.3);font-weight:800;font-size:14px}
.vis{position:absolute;right:10px;bottom:10px;z-index:2;font-size:11px;font-weight:800;padding:4px 9px;border-radius:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.sec{font-family:Cinzel,serif;font-weight:900;font-size:clamp(22px,4vw,32px);color:#f5c542;margin:40px 4px 16px;text-shadow:0 0 18px rgba(255,180,60,.35)}
.card.main{grid-column:1/-1;flex-direction:row}
.card.main .shot{flex:1.6;aspect-ratio:auto;min-height:300px}
.card.main .info{flex:1;justify-content:center;padding:24px}
.card.main .title b{font-size:30px}.card.main .info p{font-size:15px}
.card.main .chips{margin-top:0}
.cta{align-self:flex-start;margin-top:6px;font-weight:900;padding:11px 22px;border-radius:12px;background:linear-gradient(#f5c542,#b8860b);color:#2a1800;box-shadow:0 0 20px rgba(245,197,66,.45)}
@media (max-width:760px){.card.main{flex-direction:column}.card.main .shot{min-height:0;aspect-ratio:16/9;flex:none}.card.main .info{padding:15px}.play{opacity:.9;transform:scale(.8)}}
.tot.geo{cursor:pointer}.tot.geo:after{content:" 🌎";}
#geo{position:fixed;inset:0;z-index:50;background:rgba(5,2,15,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:12px}
#geo.on{display:flex}#geo .box{width:min(920px,100%);max-height:100%;overflow:auto;background:#160a2c;border:1px solid rgba(255,210,130,.35);border-radius:16px;padding:14px 16px;box-shadow:0 10px 40px #000}
#geo h3{margin:0 0 4px;font-family:Cinzel,serif;color:#f5c542;font-size:20px;display:flex;justify-content:space-between;align-items:center}
#geo h3 button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
#geo .note{font-size:11.5px;opacity:.6;margin:0 0 8px}
#geo svg{width:100%;height:auto;display:block;background:#0b1a33;border-radius:10px}
#geo .land{fill:#2b3d5e;stroke:#40567d;stroke-width:.25}
#geo .dot{fill:#f5c542;fill-opacity:.75;stroke:#fff3c4;stroke-width:.3;cursor:pointer}
#geo .dot.sel{fill:#ff5a7a}
#geo .lbl{font:700 6px sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.8px;pointer-events:none}
#geo .gz{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:5px 11px;font-weight:800;cursor:pointer}#geo .gz.on{background:#f5c542;color:#2a1800}
#geo .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
#geo .cols h4{margin:4px 0;font-size:13px;opacity:.8}
#geo ol{margin:0;padding:0;list-style:none;font-size:13.5px}
#geo li{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
#geo li b{color:#f5c542}
@media (max-width:600px){#geo .cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.shot img{transition:opacity .5s}.shot img.on{transform:none}h1{animation:none}}

  (g.sec===2?document.getElementById('grid2'):grid).appendChild(a);
  const im=a.querySelectorAll('.shot img'), dt=a.querySelectorAll('.dots i'); let cur=0, hover=false, hv=null;
  const step=()=>{ im[cur].classList.remove('on'); dt[cur].classList.remove('on'); cur=(cur+1)%im.length; im[cur].classList.add('on'); dt[cur].classList.add('on'); if(hover) bg.style.backgroundImage=`url(${im[cur].src})`; };
  setTimeout(()=>setInterval(()=>{ if(!hover) step(); },4200),i*650);
  a.addEventListener('mouseenter',()=>{ hover=true; bg.style.backgroundImage=`url(${im[cur].src})`; step(); hv=setInterval(step,1400); });
  a.addEventListener('mouseleave',()=>{ hover=false; clearInterval(hv); });
});
bg.style.backgroundImage='url(../juegos/img/mmo-3.webp)';
const fmtN=n=>Number(n||0).toLocaleString('es-CL');

const flag=cc=>cc&&cc.length==2?String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0))):'🏳️';
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showGeo(st){ const cs=st.cities||[], co=st.countries||[]; if(!co.length) return;
  const tot=document.getElementById('tot'); tot.classList.add('geo'); tot.title='Ver mapa de visitas';
  tot.onclick=()=>document.getElementById('geo').classList.add('on');
  const geo=document.getElementById('geo'); document.getElementById('geox').onclick=()=>geo.classList.remove('on');
  geo.onclick=e=>{ if(e.target===geo) geo.classList.remove('on'); };
  const mx=Math.max(1,...cs.map(c=>c.u)); const g=document.getElementById('gdots'); let h='';
  cs.slice().reverse().forEach((c,i)=>{ const x=(+c.lon+180), y=(90-c.lat), r=2+4*Math.sqrt(c.u/mx);
    h+=`<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" data-r="${r.toFixed(2)}" data-i="${cs.length-1-i}"><title>${esc(c.c||'?')}, ${esc(c.cc)} · ${c.u}</title></circle>`; });
  g.innerHTML=h+'<text id="glbl" class="lbl"></text>';
  const lbl=document.getElementById('glbl');
  let K=1; const pick=i=>{ const c=cs[i]; g.querySelectorAll('.dot').forEach(d=>d.classList.toggle('sel',+d.dataset.i===i));
    const x=+c.lon+180, y=90-c.lat; lbl.setAttribute('x',x+5*Math.max(K,.12)); lbl.setAttribute('y',y+2*Math.max(K,.12)); lbl.textContent=`${c.c||'?'} · ${c.u}`; };
  const svg=document.getElementById('gmap'), top=co[0].cc, tc=cs.filter(c=>c.cc===top);
  document.getElementById('gzc').textContent='🔍 '+flag(top)+' '+(co[0].n||top);
  const zoom=z=>{ document.querySelectorAll('#geo .gz').forEach(b=>b.classList.toggle('on',b.dataset.z===z)); let vb='0 6 360 142', k=1;
    if(z==='c'&&tc.length){ const xs=tc.map(c=>+c.lon+180), ys=tc.map(c=>90-c.lat); let x0=Math.min(...xs)-6,x1=Math.max(...xs)+6,y0=Math.min(...ys)-6,y1=Math.max(...ys)+6;
      let w=Math.max(x1-x0,24), h=Math.max(y1-y0,w/2.5); w=Math.max(w,h*2.5); const cx=(x0+x1)/2, cy=(y0+y1)/2; vb=`${(cx-w/2).toFixed(1)} ${(cy-h/2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`; k=w/360; }
    svg.setAttribute('viewBox',vb); g.querySelectorAll('.dot').forEach(d=>d.setAttribute('r',(d.dataset.r*Math.max(k,.12)).toFixed(2))); K=k; lbl.style.fontSize=(6*Math.max(k,.12))+'px'; lbl.style.strokeWidth=(.8*Math.max(k,.12))+'px'; lbl.textContent=''; svg.querySelector('.land').style.strokeWidth=.25*k; };
  document.querySelectorAll('#geo .gz').forEach(b=>b.onclick=()=>zoom(b.dataset.z));
  g.onclick=e=>{ const d=e.target.closest('.dot'); if(d) pick(+d.dataset.i); };
  document.getElementById('gcty').innerHTML=co.map(c=>`<li><span>${flag(c.cc)} ${esc(c.n||c.cc)}</span><b>${fmtN(c.u)}</b></li>`).join('');
  document.getElementById('gcit').innerHTML=cs.slice(0,15).map((c,i)=>`<li data-i="${i}" style="cursor:pointer"><span>${flag(c.cc)} ${esc(c.c||'?')}${c.r&&c.r!==c.c?' <small style="opacity:.55">'+esc(c.r)+'</small>':''}</span><b>${fmtN(c.u)}</b></li>`).join('');
  document.getElementById('gcit').onclick=e=>{ const li=e.target.closest('li'); if(li) pick(+li.dataset.i); };
}
function showStats(st){ if(!st) { document.getElementById('tot').style.display='none'; return; } try{ showGeo(st); }catch(e){}
  document.getElementById('tot').textContent=`👥 ${fmtN(st.total)} ${st.total==1?'persona ha':'personas han'} visitado Multiverso`;
  document.querySelectorAll('.vis').forEach(el=>{ const g=st.games&&st.games[el.dataset.g]; el.style.display='block'; el.textContent=g?`👥 ${fmtN(g.u)} · ▶ ${fmtN(g.h)}`:'👥 0 · ▶ 0'; el.title=g?`${g.u} personas distintas · ${g.h} visitas`:'Aún sin visitas'; }); }
(function wait(n){ if(window.MVO_STATS){ (window.MVO_VISIT||Promise.resolve()).then(()=>window.MVO_STATS()).then(showStats); } else if(n<40) setTimeout(()=>wait(n+1),100); else showStats(null); })(0);
</script>
</body></html>
