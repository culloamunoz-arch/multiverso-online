function collide(m){ let hit=false; const s=Math.sin(m.yaw), c=Math.cos(m.yaw);
 for(const [ox,oz,r] of m.D.circ){ const px=m.x+s*oz+c*ox, pz=m.z+c*oz-s*ox; let qx=px,qz=pz;
  for(const o of OBS){ const nx=clamp(qx,o.x0,o.x1), nz=clamp(qz,o.z0,o.z1); const dx=qx-nx, dz=qz-nz, d2=dx*dx+dz*dz; if(d2<r*r){ hit=true; if(d2>1e-6){ const d=Math.sqrt(d2); qx=nx+dx/d*r; qz=nz+dz/d*r; } else { qx+= (qx<(o.x0+o.x1)/2?-1:1)*0.2; } } }
  const R=Math.hypot(qx,qz); if(R>136){ qx*=136/R; qz*=136/R; hit=true; }
  m.x+=qx-px; m.z+=qz-pz; } return hit; }
function drive(m,dt){ const D=m.D; let thr=CTRL.thr, st=CTRL.st; if(m.lock) thr=0;
 const tv=thr*D.maxV*(thr<0?0.55:1); const a=thr!==0?(Math.sign(tv-m.v)===Math.sign(m.v)||m.v===0?D.acc:D.acc*2):3.5;
 m.v+=clamp(tv-m.v,-a*dt,a*dt);
 if(m.tracked){ m.yaw-=st*0.9*dt*(m.v<-0.2?-1:1); }
 else { m.steerA=lerp(m.steerA,st*D.steer,Math.min(1,dt*4)); m.yaw-=m.v*Math.tan(m.steerA)/D.wb*dt; }
 m.x+=Math.sin(m.yaw)*m.v*dt; m.z+=Math.cos(m.yaw)*m.v*dt;
 if(collide(m)){ m.v*=0.4; if(Math.abs(m.v)>3) bump(); }
 m.g.position.set(m.x,0,m.z); m.g.rotation.y=m.yaw;
 const spin=m.v*dt/0.6; m.wheels.forEach(w=>{ w.children[0].rotation.x+=spin; w.children[1].rotation.x+=spin; }); m.front.forEach(w=>w.rotation.y=m.steerA*(D.rear?-1:1));
 if(m.beacon) m.beacon.material.opacity=0.4+0.6*Math.max(0,Math.sin(perfT*9)); }

 else if(t<9){ g.visible=true; P.cargo=0; P.load.visible=false; g.position.z=Math.min(ZONES.park.z,ZONES.park.z-30+(t-6)*10); }

const PARTS=[]; const pM=new THREE.MeshStandardMaterial({color:0x7a5a36,roughness:1}); const pG=new THREE.BoxGeometry(0.18,0.18,0.18);
for(let i=0;i<160;i++){ const o=new THREE.Mesh(pG,pM); o.visible=false; scene.add(o); PARTS.push({o,l:0}); }
let pI=0; function pour(x,y,z,amount,spread,dust){ const n=dust?1:Math.ceil(amount*4); for(let i=0;i<n;i++){ const p=PARTS[pI++%PARTS.length]; p.o.visible=true; p.o.position.set(x+(Math.random()-0.5)*(spread?1.6:0.6),y,z+(Math.random()-0.5)*(spread?1.6:0.6)); p.vx=(Math.random()-0.5)*(dust?2:0.8); p.vz=(Math.random()-0.5)*(dust?2:0.8); p.vy=dust?1.5+Math.random()*2:-Math.random()*2; p.l=dust?0.5:1.4; p.o.scale.setScalar(dust?0.6+Math.random()*0.5:0.6+Math.random()); } }
function updParts(dt){ for(const p of PARTS){ if(p.l<=0) continue; p.l-=dt; p.vy-=14*dt; p.o.position.x+=p.vx*dt; p.o.position.y+=p.vy*dt; p.o.position.z+=p.vz*dt; p.o.rotation.x+=dt*4; if(p.o.position.y<0.05){ p.o.position.y=0.05; p.vy=0; p.vx*=0.5; p.vz*=0.5; } if(p.l<=0) p.o.visible=false; } }

const CAM={yaw:0,pitch:0.32,dist:13,off:0,manual:0,shake:0,tx:0,ty:0,tz:0};
function updCam(dt){ const m=MC_; if(!m) return; const D=m.D;
 let tx=m.x, ty=1.8, tz=m.z, yawT=m.yaw+Math.PI, dist=D.cam[0], h=D.cam[1], pitch=CAM.pitch;
 if(m.k==='retro'&&perfT-(m.lastArm||-9)<4&&Math.abs(m.v)<0.6){ yawT=m.yaw; tx=m.x-Math.sin(m.yaw)*3.6; tz=m.z-Math.cos(m.yaw)*3.6; dist=8.5; ty=1.2; pitch=0.62; }
 if(m.k==='grua'){ ty=1.6+m.fork*0.4; }
 if(CAM.manual>0) CAM.manual-=dt; else CAM.off=lerp(CAM.off,0,dt*1.2);
 CAM.yaw=lerpAng(CAM.yaw,yawT+CAM.off,dt*3);
 const k=1-Math.exp(-dt*7); CAM.tx=lerp(CAM.tx,tx,k); CAM.ty=lerp(CAM.ty,ty,k); CAM.tz=lerp(CAM.tz,tz,k);
 CAM.d=lerp(CAM.d||dist,dist*(CAM.zoom||1),dt*3); CAM.p=lerp(CAM.p||pitch,pitch,dt*3);
 let sx=0,sy=0; if(CAM.shake>0){ CAM.shake-=dt; sx=(Math.random()-0.5)*CAM.shake; sy=(Math.random()-0.5)*CAM.shake; }
 camera.position.set(CAM.tx+Math.sin(CAM.yaw)*Math.cos(CAM.p)*CAM.d+sx, CAM.ty+h*0.3+Math.sin(CAM.p)*CAM.d+sy, CAM.tz+Math.cos(CAM.yaw)*Math.cos(CAM.p)*CAM.d);

function auInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); mast=AC.createGain(); mast.gain.value=0.5; mast.connect(AC.destination);
 eng=AC.createOscillator(); eng.type='sawtooth'; const e2=AC.createOscillator(); e2.type='square'; engF=AC.createBiquadFilter(); engF.type='lowpass'; engF.frequency.value=380; engG=AC.createGain(); engG.gain.value=0; eng.connect(engF); e2.connect(engF); engF.connect(engG); engG.connect(mast); eng.start(); e2.start(); eng.e2=e2;
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; hyd=AC.createBufferSource(); hyd.buffer=nb; hyd.loop=true; const hf=AC.createBiquadFilter(); hf.type='bandpass'; hf.frequency.value=900; hf.Q.value=3; hydG=AC.createGain(); hydG.gain.value=0; hyd.connect(hf); hf.connect(hydG); hydG.connect(mast); hyd.start();
 const pf=AC.createBiquadFilter(); pf.type='lowpass'; pf.frequency.value=600; const pg=AC.createGain(); pg.gain.value=0; const ps=AC.createBufferSource(); ps.buffer=nb; ps.loop=true; ps.connect(pf); pf.connect(pg); pg.connect(mast); ps.start(); AC.pourG=pg; }catch(e){ AC=null; } }
function tone(f,t,d,type,v,f2){ if(!AC||muted) return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v||0.08,t); g.gain.exponentialRampToValueAtTime(0.0005,t+d); o.connect(g); g.connect(mast); o.start(t); o.stop(t+d+0.02); }
function sfx(k){ if(!AC) return; const t=AC.currentTime;
 if(k==='pay'){ [784,988,1319,1568].forEach((f,i)=>tone(f,t+i*0.07,0.18,'triangle',0.08)); }
 if(k==='ok'){ tone(660,t,0.12,'triangle',0.08); tone(990,t+0.12,0.2,'triangle',0.08); }
 if(k==='bump'){ tone(90,t,0.25,'sine',0.25,40); }
 if(k==='dig'){ tone(140,t,0.2,'sawtooth',0.06,80); }
 if(k==='clunk'){ tone(200,t,0.08,'square',0.1,120); tone(120,t+0.05,0.1,'square',0.08); }
 if(k==='beep'){ tone(1150,t,0.22,'square',0.05); }
 if(k==='ui'){ tone(880,t,0.05,'square',0.04); } }
function audioTick(dt){ if(!AC||!MC_) return; const m=MC_; const rpm=0.25+Math.min(1,Math.abs(m.v)/m.D.maxV)*0.6+Math.abs(CTRL.thr)*0.15+m.hydr*0.25;

 hydG.gain.setTargetAtTime(muted?0:m.hydr*0.05,t,0.08); AC.pourG.gain.setTargetAtTime(muted?0:(sndPour>0?0.12:0),t,0.1); sndPour-=dt;

 topa:[{k:'h+',l:'Subir hoja',i:'⬆',key:'R'},{k:'h-',l:'Bajar hoja',i:'⬇',key:'F'}]};
const KEYMAP={Space:'dump',KeyJ:'sw+',KeyL:'sw-',KeyI:'b+',KeyK:'b-',KeyU:'s+',KeyO:'s-',KeyN:'c+',KeyM:'c-',KeyR:null,KeyF:null};
function buildWorkUI(){ const m=MC_; const L=WORK[m.k]; const w=$('work'); w.style.gridTemplateColumns=`repeat(${L.length>2?2:L.length},auto)`;
 w.innerHTML=L.map(b=>`<div class="wb" data-k="${b.k}"><span>${b.i}</span>${b.l}${IS_TOUCH?'':`<kbd>${b.key}</kbd>`}</div>`).join('');
 w.querySelectorAll('.wb').forEach(el=>{ const k=el.dataset.k; const on=e=>{ e.preventDefault(); auInit(); CTRL.hold[k]=true; el.classList.add('on'); try{ el.setPointerCapture(e.pointerId); }catch(_){} }; const off=()=>{ CTRL.hold[k]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); });
 $('keys').textContent=IS_TOUCH?'':`W/S acelerar y retroceder · A/D girar · ${L.map(b=>b.key+' '+b.l.toLowerCase()).join(' · ')} · arrastra para mirar`; }
let msgT=null; function msg(a,b){ $('msg').innerHTML=a+(b?`<small>${b}</small>`:''); $('msg').classList.add('on'); clearTimeout(msgT); msgT=setTimeout(()=>$('msg').classList.remove('on'),2200); }
let tipTm=null; function tipT(t){ $('tip').textContent=t; $('tip').classList.add('on'); clearTimeout(tipTm); tipTm=setTimeout(()=>$('tip').classList.remove('on'),1400); }
function floatText(t){ const e=document.createElement('div'); e.className='fl'; e.textContent=t; e.style.left='50%'; e.style.top='50%'; e.style.transform='translate(-50%,0)'; document.body.appendChild(e); requestAnimationFrame(()=>{ e.style.transform='translate(-50%,-120px)'; e.style.opacity='0'; }); setTimeout(()=>e.remove(),1400); }
function updHUD(){ const m=MC_; $('gsp').textContent=Math.round(Math.abs(m.v)*3.6); $('ggr').textContent=m.v<-0.2?'R':Math.abs(m.v)<0.2?'N':'D';
 const T=jobTarget(); if(T){ const dx=T.x-m.x, dz=T.z-m.z, d=Math.hypot(dx,dz); const ang=Math.atan2(dx,dz)-(CAM.yaw+Math.PI); $('carr').style.transform=`rotate(${-ang}rad)`; $('cdist').textContent=d<4?T.n+' ✔':`${T.n} · ${Math.round(d)} m`; }
 if(TGT){ if(T){ TGT.visible=true; TGT.position.set(T.x,(m.k==='grua'&&JOB&&JOB.slot&&JOB.pal.att&&JOB.mode==='store')?6:5+Math.sin(perfT*3)*0.4,T.z); TGT.rotation.y+=0.03; } else TGT.visible=false; } }
let TGT=null; function makeTgt(){ TGT=new THREE.Group(); const c=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.4,4),new THREE.MeshBasicMaterial({color:0xf5b301})); c.rotation.x=Math.PI; TGT.add(c); const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xffd040,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); s.scale.setScalar(3); TGT.add(s); scene.add(TGT); }
async function showBoard(){ $('board').style.display='flex'; $('blist').textContent='Cargando…'; const L=await rpc('obras_top',{});
 if(!L){ $('blist').innerHTML='<p>No se pudo conectar con el tablero ahora. Tus créditos quedan guardados en este dispositivo.</p>'; return; }
 if(!L.length){ $('blist').innerHTML='<p>Aún no hay constructores. ¡Sé el primero!</p>'; return; }
 $('blist').innerHTML='<table>'+L.map((r,i)=>`<tr class="${r.vid===VID?'me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${(DEF[r.fav]||{}).ic||'👷'} ${String(r.name).replace(/[<>&]/g,'')}</td><td style="text-align:right">💰 ${Number(r.credits).toLocaleString('es-CL')}</td><td style="text-align:right;opacity:.7">${r.jobs} trabajos</td></tr>`).join('')+'</table>'; }
$('bBoard').onclick=showBoard; $('selBoard').onclick=showBoard; $('bClose').onclick=()=>$('board').style.display='none';
$('bSnd').onclick=()=>{ auInit(); muted=!muted; $('bSnd').textContent=muted?'🔇':'🔊'; };
$('bSwap').onclick=()=>{ showSel(); };

/* ================= ENTRADA ================= */
const K={}; addEventListener('keydown',e=>{ if(document.activeElement===$('nm')) return; auInit(); K[e.code]=true; const h=KEYMAP[e.code]; if(e.code==='KeyR') CTRL.hold[MC_&&MC_.k==='topa'?'h+':'f+']=true; else if(e.code==='KeyF') CTRL.hold[MC_&&MC_.k==='topa'?'h-':'f-']=true; else if(h) CTRL.hold[h]=true; if(e.code==='Space') e.preventDefault(); });
addEventListener('keyup',e=>{ K[e.code]=false; const h=KEYMAP[e.code]; if(e.code==='KeyR'){ CTRL.hold['h+']=CTRL.hold['f+']=false; } else if(e.code==='KeyF'){ CTRL.hold['h-']=CTRL.hold['f-']=false; } else if(h) CTRL.hold[h]=false; });
addEventListener('blur',()=>{ for(const k in K) K[k]=false; for(const k in CTRL.hold) CTRL.hold[k]=false; });
const stick={id:null,ox:0,oy:0,x:0,y:0}, look={id:null,x:0,y:0}; const cv=$('gl');
cv.addEventListener('pointerdown',e=>{ auInit(); if(mode!=='play') return;
 if(e.pointerType!=='mouse'&&e.clientX<innerWidth*0.45&&stick.id==null){ stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY; stick.x=stick.y=0; const s=$('stick'); s.style.display='block'; s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px'; $('knob').style.transform=''; }
 else if(look.id==null){ look.id=e.pointerId; look.x=e.clientX; look.y=e.clientY; } try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
cv.addEventListener('pointermove',e=>{ if(e.pointerId===stick.id){ let dx=e.clientX-stick.ox, dy=e.clientY-stick.oy; const d=Math.hypot(dx,dy), R=55; if(d>R){ dx*=R/d; dy*=R/d; } stick.x=dx/R; stick.y=dy/R; $('knob').style.transform=`translate(${dx}px,${dy}px)`; }
 else if(e.pointerId===look.id){ CAM.off-=(e.clientX-look.x)*0.007; CAM.pitch=clamp(CAM.pitch+(e.clientY-look.y)*0.004,0.1,1.1); look.x=e.clientX; look.y=e.clientY; CAM.manual=2.5; } });
const pend=e=>{ if(e.pointerId===stick.id){ stick.id=null; stick.x=stick.y=0; $('stick').style.display='none'; } if(e.pointerId===look.id) look.id=null; }; cv.addEventListener('pointerup',pend); cv.addEventListener('pointercancel',pend);
addEventListener('wheel',e=>{ CAM.zoom=clamp((CAM.zoom||1)+e.deltaY*0.001,0.6,1.8); },{passive:true});
function readInput(){ let thr=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0), st=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);
 if(stick.id!=null){ thr=Math.abs(stick.y)>0.18?-stick.y:0; st=Math.abs(stick.x)>0.15?stick.x:0; } CTRL.thr=thr; CTRL.st=st; }

/* ================= SELECCIÓN ================= */
let mode='sel', selK=SAVE.fav||'tolva', preview=null;
function renderSel(){ $('mrow').innerHTML=Object.entries(DEF).map(([k,D])=>`<div class="card mc ${k===selK?'on':''}" data-m="${k}"><span class="ic">${D.ic}</span><b>${D.n}</b><p>${D.d}</p></div>`).join('');
 $('mdesc').textContent=DEF[selK].d; $('mrow').querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{ auInit(); selK=el.dataset.m; sfx('ui'); renderSel(); setPreview(); }); }
function setPreview(){ if(preview) scene.remove(preview.g); preview=DEF[selK].make(); preview.g.position.set(-10,0,10); scene.add(preview.g); preview.g.traverse(o=>{ if(o.isMesh) o.castShadow=true; }); if(preview.load) preview.load.visible=selK==='tolva'; if(preview.cargo!==undefined&&preview.load) preview.load.visible=true; }
function showSel(){ mode='sel'; $('sel').style.display='flex'; $('hud').style.display='none'; if(MC_){ scene.remove(MC_.g); MC_=null; } if(TGT) TGT.visible=false; if(slotBox) slotBox.visible=false; if(palMark) palMark.visible=false; renderSel(); setPreview(); }
$('nm').value=SAVE.name||'';
$('goB').onclick=()=>{ auInit(); const n=$('nm').value.trim(); if(n.length<2){ $('nm').focus(); $('nm').style.borderColor='#ff5a5a'; $('nm').placeholder='Escribe tu nombre (mín. 2 letras)'; return; } SAVE.name=n.slice(0,18); SAVE.fav=selK; saveLocal(); pushBoard();
 if(preview){ scene.remove(preview.g); preview=null; } $('sel').style.display='none'; $('hud').style.display='block'; mode='play'; spawnMachine(selK); $('crv').textContent=SAVE.credits.toLocaleString('es-CL'); msg(DEF[selK].n,'¡A trabajar, '+SAVE.name+'!'); };

/* ================= BUCLE ================= */
buildWorld(); makeTgt(); renderSel(); setPreview();
let last=performance.now(), perfT=0;
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; perfT+=dt; bumpT-=dt;
 if(mode==='play'&&MC_){ readInput(); drive(MC_,dt); workUpdate(MC_,dt); updParked(dt); updCam(dt); updHUD(); audioTick(dt); }
 else { const a=perfT*0.25; camera.position.set(-10+Math.sin(a)*12,5+Math.sin(perfT*0.3),10+Math.cos(a)*12); camera.lookAt(-10,1.6,10); sun.position.set(20,60,30); sun.target.position.set(-10,0,10); if(preview){ preview.g.rotation.y=0; } if(AC) engG&&engG.gain.setTargetAtTime(0,AC.currentTime,0.2); }
 if(window.TOWER) TOWER.rotation.y+=dt*0.05;
 updParts(dt); renderer.render(scene,camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__ob={get M(){return MC_},CTRL,K,spawnMachine,get JOB(){return JOB},PALLETS,RACKS,HEAPS,ZONES,PARKED:()=>PARKED,step:(s)=>{ const n=Math.round(s*60); for(let i=0;i<n;i++){ perfT+=1/60; readInput(); drive(MC_,1/60); workUpdate(MC_,1/60); updParked(1/60); } updCam(0.016); updHUD(); },setMode:(m)=>mode=m};
</script>
</body></html>
