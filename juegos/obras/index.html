function collide(m){ let hit=false; const s=Math.sin(m.yaw), c=Math.cos(m.yaw);
 for(const [ox,oz,r] of m.D.circ){ const px=m.x+s*oz+c*ox, pz=m.z+c*oz-s*ox; let qx=px,qz=pz;
  for(const o of OBS){ const nx=clamp(qx,o.x0,o.x1), nz=clamp(qz,o.z0,o.z1); const dx=qx-nx, dz=qz-nz, d2=dx*dx+dz*dz; if(d2<r*r){ hit=true; if(d2>1e-6){ const d=Math.sqrt(d2); qx=nx+dx/d*r; qz=nz+dz/d*r; } else { qx+= (qx<(o.x0+o.x1)/2?-1:1)*0.2; } } }
  for(const [ex,ez,er] of peerObs()){ const dx=qx-ex, dz=qz-ez, d=Math.hypot(dx,dz), RR=r+er; if(d<RR&&d>1e-4){ qx=ex+dx/d*RR; qz=ez+dz/d*RR; hit=true; } }
  const R=Math.hypot(qx,qz); if(m.D.boat){ for(const I of SEA.isl){ const dx=qx-I.x, dz=qz-I.z, d=Math.hypot(dx,dz), RR=r+I.r; if(d<RR&&d>1e-4){ qx=I.x+dx/d*RR; qz=I.z+dz/d*RR; hit=true; } } const bx=clamp(qx,-1500,-347), bz=clamp(qz,-900,900); if(bx!==qx||bz!==qz){ qx=bx; qz=bz; hit=true; } } else if(m.D.route){ const lo=RING-11, hi=RING+11; if(R<lo){ qx*=lo/R; qz*=lo/R; hit=true; } else if(R>hi){ qx*=hi/R; qz*=hi/R; hit=true; } } else if(R>136){ qx*=136/R; qz*=136/R; hit=true; }
  m.x+=qx-px; m.z+=qz-pz; } return hit; }

const mf=m=>440*Math.pow(2,(m-69)/12);

  while(MUS.next<AC.currentTime+0.25){ const t=MUS.next, s=MUS.step, bar=Math.floor(s/8), ch=PROG[Math.floor(bar/2)%4], root=ch[0], iv=ch[1], inBar=s%8;

let fitT=0;
function hudFit(){ const hud=$('hud'); if(!hud||getComputedStyle(hud).display==='none') return; const W=innerWidth,H=innerHeight,G=6;
  const R=id=>$(id).getBoundingClientRect(), vis=id=>{ const e=$(id); return e&&getComputedStyle(e).display!=='none'&&e.getClientRects().length; };
  const land=H<=520&&W>640, top=$('top'), comp=$('comp');
  // en horizontal la brújula va a la derecha, bajo los botones
  if(land){ if(comp.parentNode!==hud) hud.appendChild(comp); } else if(comp.parentNode!==top) top.appendChild(comp);
  const tb=R('tbtns'); let ry=tb.bottom+G;
  if(land||W>640){ if(land) comp.style.top=ry+'px'; else comp.style.top=''; const c=R('comp'); if(c.right>W-30&&c.top<ry+60) ry=Math.max(ry,c.bottom+G); }
  else comp.style.top='';
  // columna derecha: en línea → botones sociales
  if(vis('onl')){ $('onl').style.top=ry+'px'; ry=R('onl').bottom+G; } $('soc').style.top=ry+'px'; const so=R('soc');
  // tarjeta del trabajo: entre la columna izquierda y los botones/brújula
  const job=$('job'); if(W>640){ const jr=R('job'); let lim=tb.left; const c=R('comp'); if(c.top<jr.bottom+4&&c.right>jr.left) lim=Math.min(lim,c.left); job.style.maxWidth=Math.max(180,lim-jr.left-8)+'px'; } else job.style.maxWidth='';
  // detalle de la obra: no baja más allá del velocímetro
  const ob=$('obra'), ga=R('gauge'); ob.style.maxHeight=Math.max(60,ga.top-R('obra').top-G)+'px';
  // cámara de retroceso: bajo la tarjeta del trabajo en horizontal
  const rear=$('rear'); if(land){ const jr=R('job'); rear.style.top=(jr.bottom+G)+'px'; rear.style.width=Math.min(300,W*0.36)+'px'; } else { rear.style.top=''; rear.style.width=''; } }
addEventListener('resize',()=>setTimeout(hudFit,80));
