<style>

.hud{position:fixed;pointer-events:none;text-shadow:0 3px 0 #000,0 0 6px #000}
#pos{left:16px;bottom:14px;font-size:64px;line-height:1;color:var(--y)}
#pos small{font-size:26px}
body.touch #pos{bottom:auto;top:66px;font-size:46px} body.touch #pos small{font-size:20px}
#lap{left:16px;top:12px;font-size:22px}
#time{left:16px;top:42px;font-size:16px;color:#ddd}

#msg{left:0;right:0;top:32%;text-align:center;font-size:58px;color:var(--y)}

.ctl.on{background:rgba(255,255,255,.42)}

#menu{position:fixed;inset:0;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#3a2a8a 0%,#120a30 60%,#05030f 100%);padding:14px 12px 30px}

#menu h2{margin:4px 0 12px;font-size:clamp(14px,2.4vw,22px);color:var(--c);text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.btn{pointer-events:auto;cursor:pointer;border:3px solid #fff;background:linear-gradient(#ff7a3c,#d83a1a);color:#fff;font:inherit;font-size:20px;padding:12px 22px;border-radius:14px;box-shadow:0 5px 0 #000;text-shadow:0 2px 0 #000}
.btn.alt{background:linear-gradient(#4aa8ff,#2a5ad8)}
.btn.sel{outline:4px solid var(--y)}
.card{pointer-events:auto;cursor:pointer;width:118px;border:3px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.08);padding:6px;text-align:center;font-size:13px}
.card img{width:100%;height:84px;object-fit:contain;filter:drop-shadow(0 3px 0 #000)}
.card.sel{border-color:var(--y);background:rgba(255,224,102,.22);transform:scale(1.05)}
.card .w{font-size:10px;color:var(--c)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:10px;text-align:left;margin-top:4px}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;align-self:center}.bar i{display:block;height:100%;background:var(--y)}
.track{width:200px}.track .prev{height:90px;border-radius:10px;margin-bottom:4px}
table{border-collapse:collapse;margin:10px auto;font-size:18px}
td{padding:4px 12px;border-bottom:1px solid rgba(255,255,255,.15)} tr.me td{color:var(--y)}
td img{height:34px;vertical-align:middle}
@media (max-height:520px){ .card{width:92px;padding:4px;font-size:11px} .card img{height:52px} .bars{font-size:8px} #menu h1{font-size:28px} #menu h2{margin:2px 0 6px;font-size:13px} .btn{font-size:16px;padding:8px 16px} .track{width:150px} .track .prev{height:50px} table{font-size:14px} td img{height:26px} }
.help{font-size:13px;opacity:.85;max-width:720px;text-align:center;line-height:1.5;margin-top:12px}
#mute{position:fixed;right:168px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;color:#fff;font-size:18px;z-index:5;cursor:pointer}
#pausebtn{position:fixed;right:214px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid #fff;color:#fff;font-size:16px;z-index:5;cursor:pointer;display:none}
.podium{display:flex;align-items:flex-end;gap:16px;margin:20px 0}
.podium div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.podium .blk{width:110px;background:linear-gradient(#ffe066,#c08a10);border:3px solid #000;color:#000;font-size:34px;text-align:center}
.podium img{height:90px;margin-bottom:4px;filter:drop-shadow(0 4px 0 #000)}
</style>

<script>
"use strict";
/* =========================================================

   ========================================================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u, rnd=(a,b)=>a+Math.random()*(b-a);
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
/* ---------------- characters ---------------- */
const CHARS=[

/* ---------------- tracks ---------------- */
function H0(){return 0}
const TRACKS=[
 {name:'Circuito Juguete', sub:'Universo A · cañón al atardecer', width:16, walls:'all', music:0,
  sky:['#2b1f5f','#e56a55','#ffc173'], fog:0xd88a6a, ground:'#b8704e', ground2:'#a05e40', road:'#4a4248', line:'#ffffff', curb:['#e03040','#ffffff'],
  pts:[[0,0],[120,0],[190,40],[200,120],[150,170],[60,150],[20,200],[-60,230],[-150,190],[-170,100],[-110,40]],
  h:(u)=>4*Math.sin(u*2*Math.PI*2)+2, deco:'mesa', boxes:[0.12,0.45,0.75]},
 {name:'Skatepark B-7', sub:'Universo paralelo · ¡gran salto!', width:15, walls:'all', music:1,
  sky:['#1c6f86','#d8609a','#f0a888'], fog:0xb8708e, ground:'#5e5870', ground2:'#544e66', road:'#3e3a4c', line:'#ff5aa0', curb:['#ff3a8c','#18b8e0'],
  pts:[[0,0],[140,0],[200,60],[160,130],[90,110],[40,160],[-40,200],[-140,170],[-160,80],[-90,30]],
  h:(u)=>{ const a=0.28,b=0.36; if(u>a&&u<b){ const k=(u-a)/(b-a); return k<0.85? 7*k/0.85 : 0; } return 0; }, jump:[0.28,0.36], deco:'skate', boxes:[0.1,0.5,0.8]},
 {name:'Autopista Anime', sub:'Universo anime · ¡cuidado con el tráfico!', width:22, walls:'all', music:2,
  sky:['#1e5ad2','#6eb4f5','#e6f2ff'], fog:0xbcd8f8, ground:'#8fb070', ground2:'#7fa060', road:'#3c4050', line:'#ffe066', curb:['#ffffff','#2e60ce'],
  pts:[[0,0],[260,0],[320,60],[300,160],[200,200],[60,200],[-60,240],[-200,220],[-260,120],[-200,30]],
  h:(u)=>3*Math.sin(u*2*Math.PI), traffic:true, scale:1.1, deco:'city', boxes:[0.15,0.48,0.78]},
 {name:'Arcoíris Neón', sub:'Universo neón · sin barandas... ¡no caigas!', width:13, walls:'turns', music:3,
  sky:['#02000a','#14002a','#2a0640'], fog:0x14002a, ground:null, road:'rainbow', line:'#ffffff', curb:['#3cf0ff','#ff2ea0'],
  pts:[[0,0],[160,-20],[240,60],[220,170],[120,200],[60,120],[-40,100],[-120,180],[-220,150],[-240,40],[-140,-40]],
  h:(u)=>14+10*Math.sin(u*2*Math.PI*2)+6*Math.sin(u*2*Math.PI*3+1), deco:'space', boxes:[0.1,0.42,0.7], voidY:-60, scale:1.3},
];
/* ---------------- audio ---------------- */
let AC=null,master=null,muted=false,engO=null,engG=null,engF=null,song=null,sStep=0,nT=0;
function audioInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.4; master.connect(AC.destination);
  engO=AC.createOscillator(); engO.type='sawtooth'; engF=AC.createBiquadFilter(); engF.type='lowpass'; engF.frequency.value=600; engG=AC.createGain(); engG.gain.value=0; engO.connect(engF); engF.connect(engG); engG.connect(master); engO.start(); }catch(e){AC=null} }
function tone(f,t0,d,type='square',v=0.1,sl=0){ if(!AC||muted)return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.0005,t0+d); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+0.02); }
let NB=null; function noise(t0,d,v=0.1,hp=1000){ if(!AC||muted)return; if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const x=NB.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;} const s=AC.createBufferSource(); s.buffer=NB; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=AC.createGain(); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.0005,t0+d); s.connect(f); f.connect(g); g.connect(master); s.start(t0,Math.random()*0.5,d+0.05); }
const mt=m=>440*Math.pow(2,(m-69)/12);
const SONGS=[
 {bpm:150,lead:[72,0,76,79,0,81,79,76,77,0,76,74,0,72,74,0,72,0,76,79,0,84,83,81,79,0,77,76,74,0,72,0],bass:[48,48,55,48,53,53,60,53,50,50,57,50,55,55,62,55],ch:[[60,64,67],[65,69,72],[62,65,69],[67,71,74]]},
 {bpm:176,lead:[76,0,79,0,81,0,79,76,74,0,76,0,79,0,0,0,76,0,79,0,83,0,81,79,78,0,79,0,76,0,0,0],bass:[40,40,52,40,36,36,48,36,38,38,50,38,35,35,47,35],ch:[[64,67,71],[60,64,67],[62,66,69],[59,63,66]]},
 {bpm:164,lead:[74,0,78,81,0,83,81,78,79,0,78,76,0,74,76,0,81,0,83,86,0,88,86,83,85,0,83,81,0,78,81,0],bass:[50,50,57,50,55,55,62,55,47,47,54,47,52,52,59,52],ch:[[62,66,69],[67,71,74],[59,62,66],[64,68,71]]},
 {bpm:132,lead:[69,0,72,76,0,79,76,72,74,0,72,71,0,67,69,0,81,0,79,76,0,72,74,76,77,0,76,74,0,71,72,0],bass:[45,45,57,45,41,41,53,41,43,43,55,43,40,40,52,40],ch:[[69,72,76],[65,69,72],[67,71,74],[64,68,71]]},
];
function playSong(i){ song=SONGS[i]; sStep=0; if(AC) nT=AC.currentTime+0.1; }
function musicTick(){ if(!AC) return; if(!song||muted){ nT=AC.currentTime+0.05; return; } const st=60/song.bpm/2;
  while(nT<AC.currentTime+0.15){ const i=sStep; const l=song.lead[i%song.lead.length]; if(l) tone(mt(l),nT,st*0.9,'square',0.035);
    const b=song.bass[i%16]; tone(mt(b-12),nT,st*0.85,'triangle',0.09);
    if(i%8===0){ for(const m of song.ch[Math.floor(i/8)%4]) tone(mt(m),nT,st*7,'sawtooth',0.008); }
    if(i%4===0) tone(90,nT,0.12,'sine',0.14,40); if(i%4===2) noise(nT,0.08,0.06,1800); noise(nT,0.03,0.025,7000);
    sStep++; nT+=st; } }
const SFX={
 beep:()=>AC&&tone(660,AC.currentTime,0.25,'square',0.12), go:()=>AC&&tone(1320,AC.currentTime,0.6,'square',0.12),
 box:()=>{if(!AC)return;const t=AC.currentTime;[0,4,7,12].forEach((s,i)=>tone(mt(72+s),t+i*0.04,0.08,'square',0.06))},
 roul:()=>AC&&tone(1200+Math.random()*400,AC.currentTime,0.03,'square',0.03),
 got:()=>{if(!AC)return;const t=AC.currentTime;tone(988,t,0.08,'square',0.08);tone(1480,t+0.08,0.15,'square',0.08)},
 boost:()=>{if(!AC)return;const t=AC.currentTime;tone(200,t,0.5,'sawtooth',0.1,900);noise(t,0.4,0.12,800)},
 mini:()=>{if(!AC)return;const t=AC.currentTime;tone(400,t,0.25,'sawtooth',0.08,1100)},
 hit:()=>{if(!AC)return;const t=AC.currentTime;noise(t,0.4,0.25,300);tone(300,t,0.5,'square',0.1,80)},
 throw:()=>AC&&tone(700,AC.currentTime,0.15,'square',0.07,300),
 drop:()=>AC&&tone(200,AC.currentTime,0.15,'triangle',0.15,90),
 star:()=>{if(!AC)return;const t=AC.currentTime;[0,4,7,12,16,19,24].forEach((s,i)=>tone(mt(72+s),t+i*0.05,0.1,'square',0.07))},
 zap:()=>{if(!AC)return;const t=AC.currentTime;noise(t,0.6,0.3,2500);tone(1800,t,0.5,'sawtooth',0.08,100)},
 lap:()=>{if(!AC)return;const t=AC.currentTime;[72,76,79,84].forEach((m,i)=>tone(mt(m),t+i*0.09,0.12,'square',0.08))},
 fall:()=>AC&&tone(800,AC.currentTime,1.0,'triangle',0.1,80),
 finish:()=>{if(!AC)return;const t=AC.currentTime;[60,64,67,72,67,72,76,79,84].forEach((m,i)=>tone(mt(m),t+i*0.13,0.2,'square',0.09))},
 hop:()=>AC&&tone(300,AC.currentTime,0.08,'square',0.05,500),
 wall:()=>AC&&noise(AC.currentTime,0.12,0.12,500),
};
/* ---------------- three.js setup ---------------- */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.6));
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(70,1,0.1,2500);
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=innerWidth<innerHeight?82:68; camera.updateProjectionMatrix(); layoutCtl(); }
addEventListener('resize',resize);
const hemi=new THREE.HemisphereLight(0xffffff,0x444466,0.62); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(100,200,80); scene.add(sun);
const rimL=new THREE.DirectionalLight(0xffe8d0,0.32); rimL.position.set(-80,120,-150); scene.add(rimL);
const texLoader=new THREE.TextureLoader();
const GLOW=canvasTex(64,64,(x,w,h)=>{ const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.35,'rgba(255,255,255,.8)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,w,h); });
const IMG={}; CHARS.forEach(c=>{ if(c.h3d) c.img=HEROES3D.thumb(c.id); const im=new Image(); im.src=c.img; IMG[c.id]=im; });
function canvasTex(w,h,draw,rep){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;} t.anisotropy=4; return t; }
/* ---------------- world build ---------------- */
let world=null; // {group, samples, N, len, ...}
function roadTexture(T){
  return canvasTex(256,256,(x,w,h)=>{
    if(T.road==='rainbow'){ const cols=['#ff3b5c','#ff9a3c','#ffe03c','#4cd964','#3cb4ff','#8a5cff']; for(let i=0;i<6;i++){ x.fillStyle=cols[i]; x.fillRect(i*w/6,0,w/6+1,h);} x.globalAlpha=0.35; x.fillStyle='#fff'; for(let k=0;k<8;k++) x.fillRect(0,k*32,w,3); x.globalAlpha=1; return; }
    x.fillStyle=T.road; x.fillRect(0,0,w,h); for(let i=0;i<1600;i++){ x.fillStyle=`rgba(${Math.random()<0.5?255:0},${Math.random()<0.5?255:0},255,${Math.random()*0.06})`; x.fillRect(Math.random()*w,Math.random()*h,2,2); }
    x.fillStyle=T.line; x.fillRect(w/2-3,0,6,h*0.5);
    for(let i=0;i<8;i++){ x.fillStyle=T.curb[i%2]; x.fillRect(0,i*32,14,32); x.fillRect(w-14,i*32,14,32); }
  },true);
}
function skyTexture(T){ return canvasTex(8,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); T.sky.forEach((s,i)=>g.addColorStop(i/(T.sky.length-1),s)); x.fillStyle=g; x.fillRect(0,0,w,h); }); }
function buildWorld(ti){
  if(world){ scene.remove(world.G); world.G.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  const T=TRACKS[ti]; const G=new THREE.Group(); scene.add(G);
  const S=T.scale||1.45; const pts=T.pts.map(p=>new THREE.Vector3(p[0]*S,0,p[1]*S));
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal');
  const N=900, P=[], TAN=[], NOR=[], U=[]; let len=0;
  const raw=curve.getSpacedPoints(N);
  for(let i=0;i<N;i++){ const u=i/N; const p=raw[i].clone(); p.y=T.h(u); P.push(p); }
  for(let i=0;i<N;i++){ const a=P[(i-1+N)%N], c=P[(i+1)%N]; const t=new THREE.Vector3(c.x-a.x,0,c.z-a.z).normalize(); TAN.push(t); NOR.push(new THREE.Vector3(-t.z,0,t.x)); }

    if(k.h3d){ k.h3d.animate(k.h3d.veh?{veh:true,speed:k.speed,ground:!k.air,vy:k.vy}:{sit:true,ground:!k.air,fly:k.star>0,vy:0},dt,race.time+k.ai.off*7); if(k.h3d.veh&&k.h3d.setThrust) k.h3d.setThrust(k.boost>0?1:0); k.h3d.g.rotation.z=lerp(k.h3d.g.rotation.z,k.drift>=1?k.driftDir*0.2:0,0.2); }
    if(k.vol&&k.ch.kind==='driver'){ k.vol.rotation.z=lerp(k.vol.rotation.z,k.drift>=1?k.driftDir*0.18:0,0.2); k.vol.position.y=0.75+(k.air?0.1:0)+Math.abs(Math.sin(race.time*12))*0.02*Math.min(1,k.speed/20); }

    const sp=k.drift>=1?k.spark:0; const col=sp>1.5?0xff8a20:sp>0.75?0x4ab8ff:0xffffff; const op=k.drift>=1?(sp>0.75?0.95:0.5)*(0.6+0.4*Math.random()):0;
    for(const s of [k.sparks,k.sparks2]){ s.material.color.setHex(col); s.material.opacity=op; s.scale.setScalar(0.6+Math.random()*0.6+(sp>1.5?0.5:0)); }

/* ---------------- HUD ---------------- */

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(now){

  } else if(AC&&engG) engG.gain.setTargetAtTime(0,AC.currentTime,0.1);

function stepRace(dt){

        if(player.revving){ player.boost=1.0; player.speed=player.C.top; SFX.boost(); } } }
    if(race.state==='go'||race.state==='finish'){ race.time+=dt; }

let spinA=0; function menuSpin(dt){ if(!world) return; spinA+=dt*0.08; const {P}=world; const c=P[0]; camera.position.set(c.x+Math.cos(spinA)*140,60,c.z+Math.sin(spinA)*140); camera.lookAt(c.x,0,c.z); }
/* ---------------- end race / cup ---------------- */
function endRace(){

function fmtT(t){ return `${Math.floor(t/60)}'${(t%60).toFixed(2).padStart(5,'0')}"`; }
function showStandings(){
  const st=cupState.roster.slice().sort((a,b)=>(cupState.pts[b.id]||0)-(cupState.pts[a.id]||0));

function podium(){

/* ---------------- menus ---------------- */
function menu(html){ const m=$('menu'); m.innerHTML=html; m.style.display='flex'; $('itembox').style.display='none'; $('map').style.display='none'; $('pos').innerHTML=''; $('lap').textContent=''; $('time').textContent=''; }
let mode='cup', selChar=CHARS[0], selTrack=0, CCi=1; const CCN=['50cc','100cc','150cc'], CCV=[0.85,1.0,1.12];
function titleMenu(){
  race=null; cupState=null; paused=false; showCtl(false); $('pausebtn').style.display='none'; for(const k of karts){ scene.remove(k.g); scene.remove(k.shadow);} karts=[]; player=null;

   <div class="row" style="margin-top:12px">${CCN.map((c,i)=>`<button class="btn alt ${i===CCi?'sel':''}" data-cc="${i}" style="font-size:15px;padding:8px 14px">${c}</button>`).join('')}</div>
   <div class="help">${isTouch?'◀ ▶ girar · DERRAPE: mantén mientras giras para cargar el mini-turbo (chispas azules → naranjas) · ÍTEM: usar · FRENO: frenar/retroceder. El kart acelera solo.':'← → girar · ESPACIO: saltar/derrapar (mantén para mini-turbo) · E/Z: usar ítem · ↓ frenar · P: pausa. El kart acelera solo.'}<br>💡 Truco de salida: mantén DERRAPE durante la cuenta regresiva para salir con turbo.</div>`);

function charMenu(){

   <div class="bars"><span>VEL</span><div class="bar"><i style="width:${(C.top-24)/5*100}%"></i></div><span>ACE</span><div class="bar"><i style="width:${(C.acc-8)/8*100}%"></i></div><span>GIRO</span><div class="bar"><i style="width:${(C.hand-1.6)/1.1*100}%"></i></div></div></div>`; }).join('')}</div>

}

function showMenuPause(){ const m=$('menu'); m.innerHTML=`<h1>PAUSA</h1><div class="row"><button class="btn" id="res">SEGUIR</button><button class="btn alt" id="quit">SALIR AL MENÚ</button></div>`; m.style.display='flex';

/* --- desbloqueo de audio para iOS/Safari --- */
(function(){
  function silentWav(){ const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b); const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
