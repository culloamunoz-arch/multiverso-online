const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u, rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= AUDIO: reggae tranquilo original ================= */
let AC=null,master=null,musicOn=true,nT=0,step=0,windG=null,engO=null,engG=null;
function silentWav(){ const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b); const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};

function env(t0,a,d,v){ const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(0.0005,t0+a+d); g.connect(master); return g; }

let NB=null; function noiseHit(t0,d,v,hp){ if(!NB){ NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const x=NB.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=Math.random()*2-1; } const s=AC.createBufferSource(); s.buffer=NB; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=env(t0,0.002,d,v); s.connect(f); f.connect(g); s.start(t0,Math.random()*0.5,d+0.05); }
const mt=m=>440*Math.pow(2,(m-69)/12);
// progresión I–IV–I–V (Do–Fa–Do–Sol) relajada, 74 bpm, ritmo "one drop"
const CH=[[60,64,67],[65,69,72],[60,64,67],[67,71,74]], BASS=[[48,0,48,52,55,0,57,55],[53,0,53,57,60,0,57,55],[48,0,52,48,55,0,52,50],[55,0,55,59,62,0,59,57]];
const MEL=[[0,0,79,0,76,0,74,0,72,0,0,0,74,76,0,0],[77,0,0,76,0,74,0,72,0,0,69,0,72,0,0,0],[76,0,0,79,0,0,81,0,79,0,76,0,74,0,0,0],[74,0,76,0,79,0,0,0,76,0,74,0,72,0,0,0]];
function musicTick(){ if(!AC) return; if(!musicOn){ nT=AC.currentTime+0.1; return; }
  const s16=60/74/4;
  while(nT<AC.currentTime+0.25){ const i=step%16, bar=Math.floor(step/16)%4, sec=Math.floor(step/64)%2, sw=(i%2)?s16*0.18:0, t=nT+sw;
    // batería one-drop: bombo + aro en el tiempo 3
    if(i===8){ osc('sine',62,t,0.004,0.35,0.5); osc('sine',120,t,0.002,0.08,0.2); noiseHit(t,0.06,0.18,2500); }
    if(i%2===0) noiseHit(t,0.035,i%4===2?0.05:0.03,7000);
    if(i===14&&bar===3) noiseHit(t,0.06,0.08,2500);
    // skank: acordes cortos en los contratiempos (2 y 4)
    if(i===4||i===12){ for(const m of CH[bar]){ osc('square',mt(m),t,0.003,0.11,0.022,1800); osc('triangle',mt(m+12),t,0.003,0.09,0.012); } }
    if(sec===1&&(i===6||i===14)) for(const m of CH[bar]) osc('triangle',mt(m),t,0.003,0.07,0.012);
    // bajo cálido
    const bn=BASS[bar][i>>1]; if(bn&&i%2===0) osc('sine',mt(bn-12),t,0.01,s16*1.7,0.32), osc('triangle',mt(bn-12),t,0.01,s16*1.2,0.08,500);

    if(sec===1){ const m=MEL[bar][i]; if(m){ osc('sawtooth',mt(m),t,0.06,0.5,0.018,1600); osc('sine',mt(m),t,0.05,0.55,0.035); } }
    // órgano de fondo

    step++; nT+=s16; } }
function chime(){ if(!AC) return; const t=AC.currentTime; [72,76,79,84].forEach((m,k)=>osc('sine',mt(m),t+k*0.1,0.01,0.8,0.08)); }
/* ================= THREE ================= */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});

const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(60,1,0.5,9000);

const hemi=new THREE.HemisphereLight(0xfff0e0,0x4a7a8a,0.85); scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffe0b0,0.9); sunL.position.set(-600,500,-900); scene.add(sunL);
function ctex(w,h,f){ const c=document.createElement('canvas'); c.width=w; c.height=h; f(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); return t; }
const sky=new THREE.Mesh(new THREE.SphereGeometry(8000,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,fog:false,map:ctex(8,256,(x,w,h)=>{ const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,'#3a7ac8'); g.addColorStop(0.35,'#8ac0e8'); g.addColorStop(0.48,'#ffd0a8'); g.addColorStop(0.52,'#ffb88a'); g.addColorStop(1,'#2a6a8a'); x.fillStyle=g; x.fillRect(0,0,w,h); })})); scene.add(sky);
const sunM=new THREE.Mesh(new THREE.CircleGeometry(260,32),new THREE.MeshBasicMaterial({color:0xfff2c0,fog:false,transparent:true,opacity:0.95})); scene.add(sunM);
const glowT=ctex(64,64,(x)=>{ const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,240,200,.9)'); g.addColorStop(1,'rgba(255,200,150,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); });
const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,fog:false,transparent:true,depthWrite:false})); sunGlow.scale.set(2200,2200,1); scene.add(sunGlow);
/* ---------- islas ---------- */
const ISL=[ {x:0,z:0,r:520,h:70,name:'Isla Palmera'}, {x:2300,z:-900,r:620,h:180,name:'Isla del Volcán'}, {x:-1700,z:-2300,r:480,h:90,name:'Isla Faro'}, {x:-2400,z:1300,r:380,h:60,name:'Isla Coco'}, {x:1500,z:1900,r:560,h:120,name:'Isla Cascada'}, {x:3600,z:2600,r:300,h:40,name:'Cayo Tortuga'} ];
const AIRPORTS=[ {x:0,z:60,ang:0,len:700,w:46,name:'Isla Palmera',h:6}, {x:2150,z:-760,ang:0.9,len:620,w:42,name:'Isla del Volcán',h:9}, {x:-1600,z:-2230,ang:-0.5,len:560,w:40,name:'Isla Faro',h:6} ];
function rwLocal(a,x,z){ const dx=x-a.x, dz=z-a.z, c=Math.cos(a.ang), s=Math.sin(a.ang); return {u:dx*s+dz*c, v:dx*c-dz*s}; } // u: a lo largo, v: lateral
function onRunway(x,z,pad=0){ for(const a of AIRPORTS){ const l=rwLocal(a,x,z); if(Math.abs(l.u)<a.len/2+pad&&Math.abs(l.v)<a.w/2+pad) return a; } return null; }
function n2(x,z){ return Math.sin(x*0.004+Math.sin(z*0.003))*0.5+Math.sin(z*0.0055+x*0.002)*0.35+Math.sin((x+z)*0.011)*0.15; }
function height(x,z){
  let h=-28; for(const I of ISL){ const d=Math.hypot(x-I.x,z-I.z)/I.r; if(d<1.6){ const k=Math.exp(-d*d*2.2); h=Math.max(h,-28+ (I.h+30)*k*(0.85+0.3*n2(x,z)) + (I.name==='Isla del Volcán'? -Math.max(0,140*(1-d*6.5)):0)); } }
  for(const a of AIRPORTS){ const l=rwLocal(a,x,z); const du=Math.max(0,Math.abs(l.u)-a.len/2-30), dv=Math.max(0,Math.abs(l.v)-a.w/2-40); const dd=Math.hypot(du,dv); if(dd<120){ const k=clamp(1-dd/120,0,1); h=lerp(h,a.h,k*k*(3-2*k)); } }
  return h; }
const SIZE=9600, SEG=256;
{ const g=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG); g.rotateX(-Math.PI/2); const p=g.attributes.position, col=[], c=new THREE.Color();
  for(let i=0;i<p.count;i++){ const x=p.getX(i)+500, z=p.getZ(i)+0; const h=height(x,z); p.setX(i,x); p.setY(i,h);
    if(h<1.5) c.setRGB(0.95,0.86,0.62); else if(h<4) c.setRGB(0.86,0.8,0.55).lerp(new THREE.Color(0x5aa84a),(h-1.5)/2.5); else if(h<90) c.setHSL(0.28+n2(x*3,z*3)*0.03,0.5,0.36+n2(z,x)*0.05); else if(h<140) c.set(0x7a6a5a); else c.set(0x5a4a44);
    col.push(c.r,c.g,c.b); }

  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}))); }
// mar con brillo
const waterTex=ctex(256,256,(x,w,h)=>{ x.fillStyle='#2a9ac0'; x.fillRect(0,0,w,h); for(let i=0;i<500;i++){ x.fillStyle=`rgba(255,255,255,${Math.random()*0.15})`; x.fillRect(Math.random()*w,Math.random()*h,rnd(4,16),1.5); } }); waterTex.wrapS=waterTex.wrapT=THREE.RepeatWrapping; waterTex.repeat.set(80,80);
const water=new THREE.Mesh(new THREE.PlaneGeometry(30000,30000),new THREE.MeshPhongMaterial({color:0x4ab8d8,map:waterTex,transparent:true,opacity:0.92,shininess:80,specular:0xffe8c0})); water.rotation.x=-Math.PI/2; water.position.y=0; scene.add(water);
// pistas
const rwTex=ctex(64,512,(x,w,h)=>{ x.fillStyle='#4a4a52'; x.fillRect(0,0,w,h); x.fillStyle='#fff'; for(let y=20;y<h-20;y+=40) x.fillRect(w/2-2,y,4,20); x.fillRect(4,0,3,h); x.fillRect(w-7,0,3,h); for(let k=0;k<6;k++){ x.fillRect(8+k*9,6,5,26); x.fillRect(8+k*9,h-32,5,26); } });
for(const a of AIRPORTS){ const m=new THREE.Mesh(new THREE.PlaneGeometry(a.w,a.len),new THREE.MeshLambertMaterial({map:rwTex})); m.rotation.x=-Math.PI/2; m.rotation.z=a.ang; m.position.set(a.x,a.h+0.15,a.z); scene.add(m);
  const tower=new THREE.Group(); const b=new THREE.Mesh(new THREE.CylinderGeometry(4,5,26,8),new THREE.MeshLambertMaterial({color:0xf2ece0})); b.position.y=13; tower.add(b); const top=new THREE.Mesh(new THREE.CylinderGeometry(7,6,6,8),new THREE.MeshLambertMaterial({color:0x6ab8d8})); top.position.y=29; tower.add(top);
  const l=rwLocal(a,a.x,a.z); const tx=a.x+Math.cos(a.ang)*(a.w/2+50), tz=a.z-Math.sin(a.ang)*(a.w/2+50); tower.position.set(tx,a.h,tz); scene.add(tower);
  for(let k=-3;k<=3;k++){ for(const sd of [-1,1]){ const u=k*a.len/7, v=sd*(a.w/2+3); const px=a.x+Math.sin(a.ang)*u+Math.cos(a.ang)*v, pz=a.z+Math.cos(a.ang)*u-Math.sin(a.ang)*v; const lm=new THREE.Mesh(new THREE.SphereGeometry(1.2,6,4),new THREE.MeshBasicMaterial({color:k===3?0x5aff7a:k===-3?0xff5a5a:0xffe8a0})); lm.position.set(px,a.h+1,pz); scene.add(lm); } }
  // manga de viento
  const sock=new THREE.Mesh(new THREE.ConeGeometry(2,8,8,1,true),new THREE.MeshLambertMaterial({color:0xff7a2a,side:THREE.DoubleSide})); sock.rotation.z=Math.PI/2; sock.position.set(tx+20,a.h+12,tz); scene.add(sock); }
// palmeras, casitas, faro, barquitos (instanciados)
const R0=(()=>{let s=11;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();
function scatter(n,fn){ for(let i=0;i<n;i++){ const I=ISL[Math.floor(R0()*ISL.length)]; const a=R0()*6.28, r=Math.sqrt(R0())*I.r*0.95; const x=I.x+Math.cos(a)*r, z=I.z+Math.sin(a)*r; const h=height(x,z); if(h<2.5||h>80||onRunway(x,z,60)) continue; fn(x,h,z); } }
{ const trunkG=new THREE.CylinderGeometry(0.5,0.9,12,6); trunkG.translate(0,6,0); const leafG=new THREE.ConeGeometry(6,3,7); leafG.translate(0,12,0);
  const trunks=new THREE.InstancedMesh(trunkG,new THREE.MeshLambertMaterial({color:0x8a6040}),900), leaves=new THREE.InstancedMesh(leafG,new THREE.MeshLambertMaterial({color:0x3aa04a}),900); let k=0; const M=new THREE.Matrix4(), q=new THREE.Quaternion(), s=new THREE.Vector3();

  const hc=[0xffe0b0,0xb8e8ff,0xffc0c8,0xd8ffc0,0xfff0a0], rc=[0xd85a3a,0x3a8ad8,0x2aa08a];
