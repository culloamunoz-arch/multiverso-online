{ const s=sun.shadow.camera; s.left=-26; s.right=26; s.top=26; s.bottom=-26; s.near=1; s.far=140; } sun.shadow.bias=-0.0006; scene.add(sun); scene.add(sun.target);

let AC=null,master=null,musBus=null,muted=false;
function auInit(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.4; master.connect(AC.destination); musBus=AC.createGain(); musBus.gain.value=0.5; musBus.connect(master); }catch(e){ AC=null; } }

const PAD={on:false,lx:0,ly:0,rx:0,ry:0,b:[]};
addEventListener('keydown',e=>{ auInit(); if(mode!=='play'){ if(mode==='title'&&(e.code==='Space'||e.code==='Enter')) startGame(); return; }
 if(!K[e.code]){ if(e.code==='Space'||e.code==='KeyK') P.jbuf=0.13; if(e.code==='KeyC'||e.code==='ControlLeft'||e.code==='KeyL') P.cbuf=0.12; if(e.code==='KeyP'||e.code==='Escape') togglePause(); if(e.code==='KeyM') toggleMute(); }
 K[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ K[e.code]=false; });
addEventListener('blur',()=>{ for(const k in K) K[k]=false; HOLD.jump=HOLD.run=HOLD.crouch=false; stick.on=false; });
// ratón
let drag=null; const cv=$('gl');
cv.addEventListener('pointerdown',e=>{ auInit(); if(e.pointerType!=='mouse') return; drag={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drag||e.pointerType!=='mouse') return; CAM.yaw-=(e.clientX-drag.x)*0.006; CAM.pitch=clamp(CAM.pitch+(e.clientY-drag.y)*0.004,0.08,1.1); drag={x:e.clientX,y:e.clientY}; CAM.manualT=2.5; });
cv.addEventListener('pointerup',()=>drag=null);
addEventListener('wheel',e=>{ CAM.dist=clamp(CAM.dist+e.deltaY*0.01,6,17); },{passive:true});
// táctil
const TT={stickId:null,camId:null,cx:0,cy:0,ox:0,oy:0};
function bindBtn(id,key){ const b=$(id); b.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); auInit(); b.classList.add('on'); HOLD[key]=true; if(key==='jump') P.jbuf=0.13; if(key==='crouch') P.cbuf=0.12; try{ b.setPointerCapture(e.pointerId); }catch(_){} });
 const up=e=>{ b.classList.remove('on'); HOLD[key]=false; }; b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); }
bindBtn('bA','jump'); bindBtn('bB','run'); bindBtn('bC','crouch');
cv.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'||mode!=='play') return; auInit();
 if(e.clientX<innerWidth*0.45&&TT.stickId==null){ TT.stickId=e.pointerId; TT.ox=e.clientX; TT.oy=e.clientY; stick.on=true; stick.x=stick.y=0; const s=$('stick'); s.style.display='block'; s.style.left=e.clientX+'px'; s.style.top=e.clientY+'px'; $('knob').style.transform=''; }
 else if(TT.camId==null){ TT.camId=e.pointerId; TT.cx=e.clientX; TT.cy=e.clientY; } try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
cv.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') return;
 if(e.pointerId===TT.stickId){ let dx=e.clientX-TT.ox, dy=e.clientY-TT.oy; const d=Math.hypot(dx,dy), R=56; if(d>R){ dx*=R/d; dy*=R/d; } stick.x=dx/R; stick.y=dy/R; $('knob').style.transform=`translate(${dx}px,${dy}px)`; }
 else if(e.pointerId===TT.camId){ CAM.yaw-=(e.clientX-TT.cx)*0.008; CAM.pitch=clamp(CAM.pitch+(e.clientY-TT.cy)*0.005,0.08,1.1); TT.cx=e.clientX; TT.cy=e.clientY; CAM.manualT=2.5; } });
const tEnd=e=>{ if(e.pointerId===TT.stickId){ TT.stickId=null; stick.on=false; stick.x=stick.y=0; $('stick').style.display='none'; } if(e.pointerId===TT.camId) TT.camId=null; };
cv.addEventListener('pointerup',tEnd); cv.addEventListener('pointercancel',tEnd);
function pollPad(){ const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g):null; if(!gp){ PAD.on=false; return; } PAD.on=true; PAD.lx=gp.axes[0]||0; PAD.ly=gp.axes[1]||0; PAD.rx=gp.axes[2]||0; PAD.ry=gp.axes[3]||0;
 const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed); const prev=PAD.b; PAD.b=[b(0),b(1),b(2),b(6),b(7),b(9)];
 if(PAD.b[0]&&!prev[0]){ if(mode==='title') startGame(); else P.jbuf=0.13; } if((PAD.b[1]&&!prev[1])||(PAD.b[4]&&!prev[4])) P.cbuf=0.12; if(PAD.b[5]&&!prev[5]&&mode==='play') togglePause();
 if(PAD.b.some(Boolean)||prev.some(Boolean)){ HOLD.jump=PAD.b[0]; HOLD.run=PAD.b[2]; HOLD.crouch=PAD.b[1]||PAD.b[4]; } }
function toggleMute(){ muted=!muted; $('muteB').textContent=muted?'🔇':'🔊'; if(master) master.gain.value=muted?0:0.4; }
function togglePause(){ if(mode!=='play') return; paused=!paused; $('pause').style.display=paused?'flex':'none'; }
$('muteB').onclick=()=>{ auInit(); toggleMute(); }; $('pauseB').onclick=togglePause; $('resB').onclick=togglePause;
$('hubB').onclick=()=>{ togglePause(); if(LV.id!=='hub') fadeTo(()=>{ loadLevel('hub',LV.id); }); };
$('playB').onclick=()=>{ auInit(); startGame(); };
function startGame(){ if(mode==='play') return; mode='play'; sfx('ui'); $('title').style.display='none'; $('hud').style.display='flex'; $('wname').style.display='block'; $('pauseB').style.display='flex'; $('muteB').style.display='flex';
 if(IS_TOUCH){ $('touch').style.display='block'; $('hint').style.display='block'; setTimeout(()=>$('hint').style.display='none',7000); }
 respawn(true); banner('Plaza del Multiverso',coreCount()?`💠 ${coreCount()} de 7 núcleos`:'Agáchate sobre un tubo para viajar'); P.coins=0; hud(); }

/* ================= BUCLE ================= */
loadLevel('hub'); hud();
let last=performance.now(), gt=0;
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; pollPad();
 if(mode==='play'&&!paused){ const n=Math.max(1,Math.ceil(dt/(1/120))), h=dt/n; for(let i=0;i<n;i++){ gt+=h; updMovers(gt); updPlayer(h); updEnemies(h); updItems(h,gt); } }
 else if(mode==='title'){ gt+=dt; updMovers(gt); }
 updParts(dt); animRobot(dt); updCamera(dt,now/1000); musicTick(); renderer.render(scene,camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__mr3d={P,CAM,K,HOLD,get LV(){return LV},loadLevel,startGame,step:(sec)=>{ const n=Math.round(sec*120); for(let i=0;i<n;i++){ gt+=1/120; updMovers(gt); updPlayer(1/120); updEnemies(1/120); updItems(1/120,gt); } },SAVE,groundAt};
</script>
